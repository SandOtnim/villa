<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>คืนเดียวที่วิลล่า · ONE NIGHT AT THE VILLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@200;300;400;500;600&family=Noto+Sans+Thai:wght@200;300;400;500;600&family=Charmonman:wght@400;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e8eaee; --dim:#8d97a6; --panel:#0a0d13ee; --line:#1e2733;
    --accent:#c9a227; --warn:#d9534f; --paper:#e9e4d6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070a;color:var(--ink);overflow:hidden;
    font-family:"Noto Sans Thai","Sarabun","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{user-select:none}

  /* ---------- stage ---------- */
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070a}
  #frame{position:relative;width:100%;max-width:calc(100vh * 16 / 9);aspect-ratio:16/9;
    max-height:100vh;background:#080b10;overflow:hidden}
  #sceneimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:saturate(.82) contrast(1.06) brightness(.94);transition:opacity .45s}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 32%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.88) 100%)}
  #grain{position:absolute;inset:-50%;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    animation:grain 1.1s steps(4) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}
    50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(3%,1%)}}
  #missing{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:linear-gradient(160deg,#0b1017,#05070a 60%,#0d131b);color:#5d6a7b;text-align:center;padding:24px}
  #missing b{color:#8d97a6;font-size:clamp(15px,2.4vw,22px);letter-spacing:.02em}
  #missing span{font-size:12px;letter-spacing:.12em;text-transform:uppercase}

  /* ---------- hotspots ---------- */
  .hs{position:absolute;border-radius:12px;cursor:pointer;transition:.18s;
    border:1.5px solid transparent;background:transparent}
  .hs:after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
    border-radius:50%;background:#fff;opacity:.34;box-shadow:0 0 12px 3px rgba(255,255,255,.35);
    animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.55;transform:scale(1.15)}}
  .hs.door:after{width:9px;height:9px;background:var(--accent);box-shadow:0 0 14px 4px rgba(143,214,176,.45)}
  .hs:hover,.hs.reveal{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.07);
    box-shadow:inset 0 0 32px rgba(255,255,255,.09)}
  .hs.door:hover,.hs.door.reveal{border-color:rgba(143,214,176,.65);background:rgba(143,214,176,.09)}
  .hs .tip{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;
    background:#000c;border:1px solid var(--line);padding:5px 11px;border-radius:8px;font-size:13px;
    opacity:0;transition:.15s;pointer-events:none;letter-spacing:.01em}
  .hs:hover .tip,.hs.reveal .tip{opacity:1}

  /* ---------- dialogue ---------- */
  #say{position:absolute;left:0;right:0;bottom:0;padding:22px clamp(16px,5vw,64px) clamp(20px,4vh,44px);
    background:linear-gradient(transparent,rgba(3,5,8,.82) 22%,rgba(3,5,8,.96));
    display:none;cursor:pointer;z-index:20}
  #saytext{max-width:820px;margin:0 auto;font-size:clamp(15px,1.65vw,19px);line-height:1.85;
    white-space:pre-wrap;text-shadow:0 2px 14px #000}
  #saymore{max-width:820px;margin:12px auto 0;font-size:11.5px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;animation:blink 1.7s infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:.9}}

  /* ---------- hud ---------- */
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;
    padding:10px clamp(10px,2vw,20px);z-index:15;
    background:linear-gradient(rgba(3,5,8,.78),transparent)}
  #where{font-size:clamp(11px,1.3vw,13px);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{background:#0c1119cc;border:1px solid var(--line);color:var(--ink);padding:7px 12px;
    border-radius:9px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .btn:hover{background:#141c28;border-color:#33445a}
  .btn.badge{position:relative}
  .btn.badge i{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#04150c;
    font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}

  /* ---------- bag ---------- */
  #bag{position:absolute;left:0;right:0;bottom:0;display:flex;gap:7px;justify-content:center;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:14;flex-wrap:wrap;
    background:linear-gradient(transparent,rgba(3,5,8,.72))}
  .slot{background:#0b1119dd;border:1px solid var(--line);border-radius:9px;padding:6px 11px;
    font-size:12.5px;cursor:pointer;transition:.15s;color:var(--dim)}
  .slot:hover{color:var(--ink);border-color:#3a4c63}
  .slot.on{border-color:var(--accent);color:var(--accent);background:#0e1c17}

  /* ---------- modal ---------- */
  .mod{position:fixed;inset:0;z-index:76;display:none;align-items:center;justify-content:center;
    background:rgba(2,4,7,.86);backdrop-filter:blur(7px);padding:16px}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    width:min(760px,100%);max-height:88vh;overflow:auto;padding:clamp(18px,3vw,30px);
    box-shadow:0 30px 80px #000c}
  .sheet h2{margin:0 0 4px;font-size:clamp(17px,2.2vw,22px);letter-spacing:.01em}
  .sheet h3{margin:22px 0 9px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
  .close{float:right;margin:-6px -6px 0 0}
  .paper{background:linear-gradient(#f3efe2,#e6e0cf);color:#1e1a13;border-radius:10px;
    padding:clamp(18px,3vw,30px);white-space:pre-wrap;line-height:1.95;font-size:clamp(14px,1.5vw,16px);
    box-shadow:inset 0 0 60px rgba(120,100,60,.22);font-family:"Noto Serif Thai",Georgia,serif}
  .paper b{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:#6b5f45;margin-bottom:14px}
  .card{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;
    background:#0b1017;cursor:pointer;transition:.15s}
  .card:hover{border-color:#3a4c63;background:#0f151f}
  .card.on{border-color:var(--accent);background:#0e1c17}
  .card.done{border-color:#2d5f45;background:#0a1712}
  .card b{display:block;margin-bottom:4px;font-size:14.5px}
  .card small{color:var(--dim);line-height:1.7;font-size:12.8px}
  .muted{color:var(--dim);font-size:13px;line-height:1.8}

  /* ---------- keypad ---------- */
  #dial{display:flex;gap:9px;justify-content:center;margin:18px 0}
  #dial span{width:clamp(42px,10vw,56px);height:clamp(56px,13vw,72px);border:1px solid var(--line);
    border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(22px,5vw,30px);background:#080c12;font-variant-numeric:tabular-nums}
  #pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:290px;margin:0 auto}
  #pad button{aspect-ratio:1.5;font-size:19px;background:#0c1119;border:1px solid var(--line);
    color:var(--ink);border-radius:11px;cursor:pointer;font-family:inherit}
  #pad button:active{background:#182231}

  /* ---------- ranat ---------- */
  #bars{display:flex;gap:8px;justify-content:center;align-items:flex-end;margin:22px 0;height:150px}
  #bars i{flex:1;max-width:52px;background:linear-gradient(#6b4a25,#3d2913);border:1px solid #12212e;
    border-radius:6px;cursor:pointer;transition:.12s;display:block}
  #bars i:hover{filter:brightness(1.4)}
  #bars i.hit{filter:brightness(2);transform:translateY(4px)}

  /* ---------- scare ---------- */
  #scare{position:fixed;inset:0;z-index:90;display:none;background:#000}
  #scare img{width:100%;height:100%;object-fit:cover;filter:contrast(1.5) saturate(.4) brightness(1.1)}
  .shake{animation:shk .42s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shk{10%,90%{transform:translate3d(-3px,2px,0)}20%,80%{transform:translate3d(6px,-4px,0)}
    30%,50%,70%{transform:translate3d(-11px,5px,0)}40%,60%{transform:translate3d(11px,-5px,0)}}
  #flash{position:fixed;inset:0;z-index:91;background:#fff;opacity:0;pointer-events:none}

  /* ---------- toast ---------- */
  #toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:30;
    display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
  .tst{background:#0c1119ee;border:1px solid var(--accent);color:var(--accent);padding:9px 17px;
    border-radius:10px;font-size:13px;animation:tin .35s;box-shadow:0 8px 30px #000a}
  @keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

  /* ================= เมนูหลัก (ระบบกลาง SANDOTNIM GAMES) ================= */
  #title{position:fixed;inset:0;z-index:70;background:#05070a;overflow:hidden;display:block}
  #tBgWrap{position:absolute;inset:0;will-change:transform}
  #tBg{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.4s ease}
  #tBg.on{opacity:1}
  .tScrim{position:absolute;inset:0;pointer-events:none}
  .tScrim.a{background:rgba(0,0,0,.14)}
  .tScrim.v{background:radial-gradient(132% 100% at 62% 38%,transparent 28%,rgba(0,0,0,.82) 100%)}
  .tScrim.l{background:linear-gradient(95deg,rgba(0,0,0,.80) 0%,rgba(0,0,0,.36) 34%,transparent 60%)}
  .tScrim.b{background:linear-gradient(0deg,rgba(0,0,0,.68) 0%,transparent 44%)}
  #tDust{position:absolute;inset:0;pointer-events:none}
  #tShaft{position:absolute;top:-40%;left:35%;width:60%;height:190%;transform:rotate(16deg);
    pointer-events:none;mix-blend-mode:screen;filter:blur(26px);
    background:linear-gradient(90deg,transparent,rgba(201,162,39,.30) 42%,rgba(143,214,176,.12) 52%,transparent)}
  .tMark{position:absolute;top:26px;left:7%;display:flex;align-items:center;gap:9px;z-index:3;
    font-size:10px;letter-spacing:.35em;color:var(--dim)}
  .tMark i{width:16px;height:1px;background:var(--accent);display:block}
  .tBrand{position:absolute;top:11%;left:7%;right:7%}
  .tPlate{position:absolute;inset:-40px -90px -50px -70px;pointer-events:none;filter:blur(26px);
    background:radial-gradient(closest-side at 22% 50%,rgba(0,0,0,.5),rgba(0,0,0,.22) 55%,transparent 82%)}
  #title h1{position:relative;margin:0;font-family:"Noto Serif Thai",Georgia,serif;font-weight:600;
    font-size:clamp(34px,5.2vw,66px);line-height:.98;letter-spacing:4px;
    text-shadow:0 2px 6px rgba(0,0,0,.72),0 8px 44px rgba(0,0,0,.8);
    opacity:0;transform:translateY(14px);transition:1s cubic-bezier(.16,1,.3,1) .3s}
  #title p{position:relative;margin:14px 0 0;color:#ffffffc4;font-weight:300;text-transform:none;
    font-size:clamp(9px,.94vw,12px);letter-spacing:.42em;line-height:1.7;max-width:620px;
    text-shadow:0 2px 14px rgba(0,0,0,.8);
    opacity:0;transform:translateY(14px);transition:1s cubic-bezier(.16,1,.3,1) .42s}
  .tHair{position:relative;margin-top:34px;width:0;height:1px;background:var(--accent);
    box-shadow:0 0 10px var(--accent);transition:width 1.4s cubic-bezier(.16,1,.3,1) .85s}
  #title.ready h1,#title.ready p{opacity:1;transform:none}
  #title.ready .tHair{width:130px}
  #tNav{position:absolute;bottom:17%;left:7%;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
  .titem{position:relative;background:none;border:0;cursor:pointer;padding:2px 0;text-align:left;
    font-family:"Noto Serif Thai",Georgia,serif;font-weight:300;color:#ffffffab;
    font-size:clamp(15px,1.9vw,24.5px);letter-spacing:2px;
    text-shadow:0 2px 5px rgba(0,0,0,.72),0 6px 26px rgba(0,0,0,.8);
    opacity:0;transform:translateX(-12px);
    transition:color .26s,transform .34s cubic-bezier(.16,1,.3,1),opacity .6s,letter-spacing .26s}
  .titem.in{opacity:1;transform:none}
  .titem::before{content:"";position:absolute;left:-20px;top:50%;width:0;height:1px;
    background:var(--accent);box-shadow:0 0 12px var(--accent);
    transition:width .3s cubic-bezier(.16,1,.3,1)}
  .titem:hover{color:#fff;transform:translateX(5px);letter-spacing:3px}
  .titem:hover::before{width:12px}

  #hint{position:absolute;right:12px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:16}
  #dev{position:fixed;left:6px;bottom:6px;color:#0f0;font:11px monospace;z-index:99;display:none}
  @media (max-width:640px){
    #saytext{font-size:15px;line-height:1.8}
    .btn{padding:7px 10px;font-size:12px}
    #where{letter-spacing:.1em}
  }
  /* ================= สมุดคดี — แฟ้ม 3 มิติ ================= */
  #mCase{padding:0;background:rgba(2,4,7,.9)}
  .dwrap{position:absolute;inset:0;display:grid;grid-template-columns:minmax(250px,29%) 1fr;
    align-items:center;padding:0 5%;gap:10px}
  @media(max-width:900px){.dwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:3vh 5%}}
  .dside{padding-right:26px}
  .dside h2{margin:0;font-family:"Noto Serif Thai",Georgia,serif;font-weight:500;
    font-size:clamp(22px,3vw,38px);letter-spacing:.06em;text-shadow:0 4px 30px #000}
  .dcap{margin-top:.6em;font-size:11px;letter-spacing:.4em;color:var(--dim)}
  .dhair{margin-top:1.1em;width:clamp(56px,8vw,105px);height:1px;background:var(--accent);
    box-shadow:0 0 10px var(--accent)}
  .dcount{margin-top:22px;font-size:12px;letter-spacing:.18em;color:var(--dim)}
  .dcount b{color:var(--accent);font-weight:500}
  .dinfo{margin-top:18px;min-height:180px}
  .dinfo .n{font-size:11px;letter-spacing:.32em;color:var(--accent);margin-bottom:7px}
  .dinfo h3{margin:0 0 10px;font-family:"Noto Serif Thai",Georgia,serif;font-weight:500;
    font-size:clamp(16px,1.9vw,23px)}
  .dinfo p{margin:0;font-size:clamp(12px,1vw,14px);color:var(--dim);line-height:1.95;max-width:400px}
  .dinfo .e{color:#ffffff52;font-size:12.5px;line-height:1.9;max-width:380px}
  .dhints{margin-top:26px;display:flex;flex-wrap:wrap;gap:9px 20px}
  .dhint{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim)}
  .dhint b{font-weight:500;font-size:10px;letter-spacing:.1em;color:var(--ink);
    border:1px solid #ffffff26;padding:5px 9px;min-width:38px;text-align:center}
  .dcloseb{position:absolute;left:5%;bottom:6%;font-size:12.5px;letter-spacing:.18em;color:var(--dim);
    background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:10px;z-index:8;font-family:inherit}
  .dcloseb:hover{color:var(--accent)}
  .dcloseb i{width:20px;height:1px;background:currentColor;transition:width .25s}
  .dcloseb:hover i{width:30px}

  .dstage{perspective:1900px;perspective-origin:52% 46%;display:flex;align-items:center;
    justify-content:center;height:100%}
  .dbook{position:relative;width:min(56vw,690px);aspect-ratio:1.42/1;transform-style:preserve-3d;cursor:grab}
  .dbook.grab{cursor:grabbing}
  .dboard{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;
    background:linear-gradient(160deg,#c2a878,#a2895a);box-shadow:inset 0 0 60px #00000038}
  .dboard.l{left:0;opacity:0;transition:opacity .7s ease .35s;border-radius:8px 2px 2px 8px;
    transform:translateZ(-30px) rotateY(2.5deg);transform-origin:right center}
  .dboard.r{right:0;border-radius:2px 8px 8px 2px;
    transform:translateZ(-30px) rotateY(-2.5deg);transform-origin:left center}
  .dspine{opacity:0;transition:opacity .7s ease .35s;position:absolute;left:50%;top:-1%;height:102%;
    width:30px;transform:translateX(-50%) translateZ(-34px);pointer-events:none;
    background:linear-gradient(90deg,#00000000,#0000005e 42%,#0000005e 58%,#00000000)}
  .dbook.opened .dboard.l,.dbook.opened .dspine{opacity:1}

  #dSheets{position:absolute;inset:0;transform-style:preserve-3d}
  .dsheet{position:absolute;top:0;right:0;width:50%;height:100%;
    transform-origin:left center;transform-style:preserve-3d}
  .dpaper{position:absolute;inset:0;transform-origin:right center;transform-style:preserve-3d}
  .dface{position:absolute;inset:0;backface-visibility:hidden;transform-style:preserve-3d;
    background:linear-gradient(150deg,#f1e9d8,#e2d7be);
    box-shadow:inset 0 0 46px #6a5a3a2e,0 10px 26px #00000047}
  .dface.f{border-radius:2px 7px 7px 2px;
    background-image:linear-gradient(90deg,#00000024,transparent 7%),linear-gradient(150deg,#f1e9d8,#e2d7be)}
  .dface.b{transform:rotateY(180deg);border-radius:7px 2px 2px 7px;
    background-image:linear-gradient(270deg,#00000024,transparent 7%),linear-gradient(150deg,#f1e9d8,#e2d7be)}
  .dgloss{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit;
    mix-blend-mode:overlay;z-index:9}

  .dcover{position:absolute;top:-1.5%;right:0;width:50.5%;height:103%;transform:translateZ(30px);
    transform-origin:left center;transform-style:preserve-3d;
    transition:transform 1.15s cubic-bezier(.55,.05,.25,1)}
  .dcover.open{transform:translateZ(-60px) rotateY(-176deg);pointer-events:none}
  .dcf{position:absolute;inset:0;backface-visibility:hidden}
  .dcf.f{border-radius:3px 10px 10px 3px;background:linear-gradient(155deg,#cdb27b,#967c4b);
    box-shadow:0 30px 70px #000000ad,inset 0 0 70px #00000030;
    display:flex;flex-direction:column;justify-content:center;padding:11% 12%}
  .dcf.b{transform:rotateY(180deg);border-radius:10px 3px 3px 10px;
    background:linear-gradient(155deg,#b19766,#856f44);box-shadow:inset 0 0 70px #00000042}
  .dlabel{position:relative;background:#f2ead6;padding:16px 20px;box-shadow:0 6px 18px #00000045;
    transform:rotate(-1.1deg);max-width:82%}
  .dlabel .t{font-family:"Noto Serif Thai",Georgia,serif;font-size:clamp(14px,1.6vw,21px);
    color:#23262c;font-weight:600;letter-spacing:.03em;line-height:1.35}
  .dlabel .s{white-space:nowrap;margin-top:7px;font-size:9.5px;letter-spacing:.3em;color:#6d6a60}
  .dstamp{position:absolute;right:9%;bottom:11%;border:3px solid #b6473c8c;color:#b6473cd6;
    font-family:"Noto Serif Thai",Georgia,serif;font-weight:600;font-size:clamp(10px,1.1vw,14px);
    padding:7px 14px;transform:rotate(-9deg);letter-spacing:.1em}
  .dhintopen{position:absolute;left:0;right:0;bottom:-42px;text-align:center;font-size:11.5px;
    letter-spacing:.22em;color:#ffffff8f;animation:dpuls 2.6s ease-in-out infinite}
  @keyframes dpuls{50%{opacity:.42}}

  .dpg{position:absolute;inset:0;padding:7.5% 8%;transform-style:preserve-3d}
  .dpg h5{margin:0;font-family:"Noto Serif Thai",Georgia,serif;font-size:clamp(10px,1.1vw,14px);
    color:#3a3a34;letter-spacing:.16em;border-bottom:1px solid #00000024;padding-bottom:7px;font-weight:500}
  .dslot{position:absolute;transform-style:preserve-3d;cursor:pointer;
    transform:translateZ(var(--z,5px)) rotate(var(--r,0deg));
    transition:transform .5s cubic-bezier(.16,1,.3,1)}
  .dslot::after{content:"";position:absolute;inset:3px;background:#20180c;opacity:.36;
    filter:blur(9px);border-radius:2px;transform:translateZ(-7px) translate(6px,10px);
    transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .5s,filter .5s}
  .dslot:hover{transform:translateZ(30px) rotate(var(--r,0deg)) scale(1.02)}
  .dslot:hover::after{opacity:.44;filter:blur(20px);transform:translateZ(-30px) translate(15px,25px)}
  .dslot.sel{transform:translateZ(52px) rotate(var(--r,0deg)) scale(1.05)}
  .dslot.sel .ddoc{box-shadow:0 0 0 2px var(--accent),0 0 22px rgba(201,162,39,.55)}
  .ddoc{position:relative;background:#fdfaf1;padding:7px 7px 24px;
    box-shadow:inset 1.5px 1.5px 0 #ffffffe0,0 1px 0 #cbbfa4,0 2px 0 #b9ad92;transition:box-shadow .25s}
  .ddoc img{display:block;width:100%;aspect-ratio:1.2/1;object-fit:cover;background:#242830}
  .dlab{position:absolute;left:0;right:0;bottom:3px;text-align:center;padding:0 7px;
    font-family:"Charmonman",cursive;font-size:clamp(8.5px,.88vw,12px);color:#2a2f38;line-height:1.15}
  .dtab{position:absolute;top:-7px;right:-7px;background:#b6473c;color:#fff2e8;
    font-family:"Noto Serif Thai",Georgia,serif;font-size:clamp(8px,.8vw,11px);padding:2px 7px;
    transform:translateZ(2px) rotate(3deg);letter-spacing:.06em}
  .dtape{position:absolute;width:52px;height:17px;background:#e9e0c17d;transform-style:preserve-3d;
    box-shadow:0 1px 3px #0000002e,inset 0 0 0 1px #ffffff2e;
    top:-8px;left:50%;transform:translateX(-50%) translateZ(3px) rotate(-2deg)}
  .dnote{background:#faf6ea;padding:11px 13px;border-left:3px solid #b6473c5e;
    box-shadow:inset 1px 1px 0 #fffffff0,0 1px 0 #ccc0a6;
    font-family:"Charmonman",cursive;font-size:clamp(9px,.95vw,12.5px);color:#3f4a57;line-height:1.55}
  .dsticky{background:#f4e388;padding:10px 12px;box-shadow:inset 0 -14px 18px -14px #00000026,0 1px 0 #d8c96f;
    font-family:"Itim",cursive;font-size:clamp(9px,.92vw,12px);color:#4a3f1c;line-height:1.5}
  .dtyped{font-family:"Noto Sans Thai",sans-serif;font-size:clamp(8px,.85vw,11px);color:#3d4550;line-height:1.9}
  .dcardp{background:#fbf7ec;padding:9px 11px;box-shadow:inset 1px 1px 0 #fffffff0,0 1px 0 #ccc0a6;
    display:flex;gap:9px;align-items:flex-start;overflow:hidden}
  .dcardp .tx{min-width:0}
  .dcardp img{width:34%;aspect-ratio:1/1.1;object-fit:cover;background:#242830;flex:none}
  .dcardp .tx b{display:block;font-family:"Noto Serif Thai",Georgia,serif;font-size:clamp(9px,.95vw,12.5px);
    color:#23262c;margin-bottom:3px}
  .dcardp .tx small{font-family:"Noto Sans Thai",sans-serif;font-size:clamp(7.5px,.78vw,10px);
    color:#5c6470;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;
    -webkit-box-orient:vertical;overflow:hidden}
  .dconc{background:#f7f2e3;padding:11px 13px;box-shadow:inset 1px 1px 0 #fffffff0,0 1px 0 #ccc0a6;
    border-top:3px solid #2d5f4566}
  .dconc b{display:block;font-family:"Noto Serif Thai",Georgia,serif;color:#1f3a2c;
    font-size:clamp(9px,.95vw,12.5px);margin-bottom:4px}
  .dconc small{font-family:"Noto Sans Thai",sans-serif;font-size:clamp(7.5px,.78vw,10px);
    color:#4b5560;line-height:1.7;display:block}
  .dlock{border:1.5px dashed #0000003d;background:#0000000a;display:flex;align-items:center;
    justify-content:center;color:#00000030;font-family:"Noto Serif Thai",Georgia,serif;
    font-size:clamp(11px,1.3vw,17px);cursor:default;--z:0px;letter-spacing:.2em}
  .dlock::after{display:none}
  .dlock:hover{transform:translateZ(0) rotate(var(--r,0deg))}
  .dclip{position:absolute;width:13px;height:39px;border:3px solid #939aa2;border-radius:9px;
    box-shadow:0 3px 6px #00000047;transform:translateZ(7px)}
  .dclip.dark{border-color:#41464e}
  .dnavwrap{position:absolute;inset:0;pointer-events:none;z-index:60;opacity:0;transition:opacity .6s ease .5s}
  .dbook.opened .dnavwrap{opacity:1}
  .dnav{pointer-events:auto;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;
    border:1px solid #ffffff26;color:var(--dim);display:flex;align-items:center;justify-content:center;
    font-size:17px;background:#0b0d1166;backdrop-filter:blur(6px);transition:.2s;cursor:pointer;font-family:inherit}
  .dnav:hover{border-color:var(--accent);color:var(--accent)}
  .dnav[disabled]{opacity:.2;cursor:not-allowed}
  .dnav.prev{left:-66px}.dnav.next{right:-66px}
  @media(max-width:900px){.dnav.prev{left:-6px}.dnav.next{right:-6px}}
  .dpageno{position:absolute;left:0;right:0;bottom:-44px;text-align:center;font-size:10.5px;
    letter-spacing:.26em;color:#ffffff70}

  /* ================= หน้าโหลด (หลังกดเริ่มเกม) ================= */
  #load{position:fixed;inset:0;z-index:72;display:none;background:#05070a;overflow:hidden}
  #load.on{display:block}
  #lBgWrap{position:absolute;inset:0;will-change:transform}
  #lBg{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1s}
  #lBg.on{opacity:1}
  #load .sc{position:absolute;inset:0;pointer-events:none}
  #load .sc.v{background:radial-gradient(132% 100% at 60% 40%,transparent 26%,rgba(0,0,0,.86) 100%)}
  #load .sc.b{background:linear-gradient(0deg,rgba(0,0,0,.82) 0%,transparent 48%)}
  #load .wrap{position:absolute;left:7%;right:7%;bottom:12%}
  #load .gname{font-family:"Noto Serif Thai",Georgia,serif;font-weight:400;letter-spacing:.08em;
    font-size:clamp(18px,2.4vw,30px);text-shadow:0 4px 30px #000}
  #load .tip{margin-top:1.5em;font-size:clamp(12px,1.1vw,15px);color:var(--dim);max-width:540px;
    line-height:1.8;min-height:3.6em;transition:opacity .5s;text-shadow:0 2px 16px #000}
  #load .barwrap{margin-top:2.1em;display:flex;align-items:center;gap:16px;max-width:520px}
  #load .bar{flex:1;height:1px;background:#ffffff24;position:relative;overflow:hidden}
  #load .bar span{position:absolute;inset:0 auto 0 0;width:0%;background:var(--accent);
    box-shadow:0 0 12px var(--accent);transition:width .25s linear}
  #load .pct{font-size:12px;letter-spacing:.14em;color:var(--dim);min-width:40px;text-align:right;
    font-variant-numeric:tabular-nums}

  /* ================= เล่นกับเพื่อน ================= */
  #mpCur{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .mpc{position:absolute;transform:translate(-2px,-2px);transition:left .09s linear,top .09s linear;
    will-change:left,top}
  .mpc svg{display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.7))}
  .mpc b{position:absolute;left:15px;top:15px;font-size:10.5px;font-weight:500;letter-spacing:.04em;
    padding:2px 7px;border-radius:99px;white-space:nowrap;color:#0b0c10}
  .mpc.click svg{animation:mpTap .45s ease-out}
  @keyframes mpTap{0%{transform:scale(1)}35%{transform:scale(.72)}100%{transform:scale(1)}}
  .mpRing{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    border:2px solid;pointer-events:none;animation:mpRing .6s ease-out forwards}
  @keyframes mpRing{from{transform:scale(.3);opacity:.95}to{transform:scale(2.4);opacity:0}}

  #mpBar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:22;display:none;
    align-items:center;gap:7px;padding:6px 10px;border-radius:99px;background:#0a0d13cc;
    border:1px solid var(--line);backdrop-filter:blur(8px);font-size:11.5px;color:var(--dim)}
  #mpBar.on{display:flex}
  #mpBar .who{display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;
    background:#ffffff0d;color:#e8eaee}
  #mpBar .dot{width:7px;height:7px;border-radius:50%;display:block}
  #mpBar .rm{color:#6f7787;letter-spacing:.12em}

  #mpLobby{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(2,4,7,.9);backdrop-filter:blur(9px);padding:18px}
  #mpLobby.on{display:flex}
  .mpCard{width:min(460px,100%);background:#0a0d13f2;border:1px solid var(--line);border-radius:16px;
    padding:26px 28px;box-shadow:0 30px 80px #000c}
  .mpCard h3{font-family:"Noto Serif Thai",Georgia,serif;font-weight:500;font-size:21px;margin-bottom:5px}
  .mpCard .cap{font-size:11px;letter-spacing:.34em;color:var(--dim);margin-bottom:20px}
  .mpCard label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px;letter-spacing:.06em}
  .mpCard input{width:100%;background:#12161d;border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:11px 13px;font-family:inherit;font-size:14px}
  .mpCard input:focus{outline:none;border-color:var(--accent)}
  .mpRow{display:flex;gap:9px;margin-top:20px}
  .mpBtn{flex:1;font-family:inherit;font-size:13.5px;padding:12px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink);transition:.16s}
  .mpBtn:hover{border-color:var(--accent);color:var(--accent)}
  .mpBtn.main{background:var(--accent);border-color:var(--accent);color:#08110c;font-weight:600}
  .mpBtn.main:hover{filter:brightness(1.1);color:#08110c}
  .mpNote{margin-top:16px;font-size:11.5px;color:#6f7787;line-height:1.85}
  .mpStat{margin-top:14px;font-size:12px;color:var(--accent);min-height:20px;letter-spacing:.04em}
  .mpPeers{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
  .mpPeers span{font-size:11.5px;padding:3px 10px;border-radius:99px;background:#ffffff0f;color:#e8eaee}
</style>
</head>

<div id="stage">

</div>

</div></div>

</div></div>

</div></div>

<div class="mod" id="mAccuse"><div class="sheet" style="max-width:520px">

</div></div>

  <div id="endStats" class="muted" style="margin-top:14px"></div>

</div></div>

    <button class="titem" id="tSet"></button>
    <button class="titem" id="tMP"></button>
  </nav>
  <button id="tLang" style="display:none"></button>
</div>
<div id="load">
  <div id="lBgWrap"><div id="lBg"></div></div>
  <div class="sc v"></div><div class="sc b"></div>

    <div class="tip" id="lTip"></div>
    <div class="barwrap"><div class="bar"><span id="lBar"></span></div><div class="pct" id="lPct">0%</div></div>

</div>
<div id="mpLobby"><div class="mpCard">

    body:{th:"ตารางถ่ายงานแต่ง เขียนเรียบร้อยเป็นระเบียบผิดกับคนเขียน\n\n— ตั้งกล้องไทม์แลปส์ทางเดินชั้น 2 ทั้งคืน (เก็บแสงเช้าเข้าหน้าต่าง เอาไปทำ opening งานพรุ่งนี้)\n— ห้ามลืมปิดกล้อง ก่อนตี 6\n\nด้านล่างสุด เขียนทีหลัง หมึกคนละสี ลายมือรีบมาก:\n\n“ลืมว่ากล้องมันถ่ายอยู่\nซวยละ”",
        en:"A neat shooting schedule — neater than the man who wrote it.\n\n— Time-lapse rig, 2nd-floor corridor, all night (for the morning light through the window; use as tomorrow's opening shot)\n— DO NOT forget to kill the camera before 6am\n\nAnd at the bottom, added later, different ink, very fast handwriting:\n\n“forgot the camera was running.\noh no.”"} },

  n_photo:{ title:{th:"รูปที่เพิ่งล้างเสร็จ",en:"The print, still dripping"},
    body:{th:"ขาวดำ เกรนหยาบ ไทม์สแตมป์มุมล่าง 01:47:12\n\nทางเดินชั้นสอง ไฟดวงเดียว\nผู้ชายไหล่กว้าง มีเครา ย่อตัวลงหน้าประตูห้องหมายเลข 2\nมือขวากำลังสอดกระดาษแผ่นหนึ่งเข้าไปใต้ประตู\nแขนซ้ายที่ยันพื้นอยู่มีรอยสักเข็มทิศชัดเจน\n\nและปลายทางเดินด้านหลังเขา — หน้าต่างบานนั้นปิดสนิทอยู่แล้ว\n\nแปลว่าคนที่ปิดหน้าต่าง ขึ้นมาก่อนหน้านี้\nคนละคน คนละเวลา คนละเรื่อง",
        en:"Black and white, heavy grain. Timestamp in the corner: 01:47:12\n\nSecond-floor corridor. One lamp.\nA broad-shouldered bearded man crouched at the door of room 2.\nHis right hand is feeding a sheet of paper under it.\nThe left arm braced on the floor carries a compass tattoo, unmistakable.\n\nAnd at the far end of the corridor behind him — that window is already shut.\n\nWhich means whoever closed it came up earlier.\nDifferent man. Different hour. Different reason."} },

  n_mirror:{ title:{th:"ลายนิ้วมือบนกระจกฝ้า",en:"Fingerprints in the fog"},
    body:{th:"ไอน้ำยังไม่จางดี ตัวหนังสือเขียนไว้ตั้งแต่ตอนอาบน้ำ แล้วรอให้ใครสักคนเข้ามาเห็น\n\n“ขอโทษที่เอาไปสอดเอง\nผมเจอมันขยำอยู่ในถังขยะห้องครัว\nผมคลี่ให้เรียบแล้วเอาไปให้คุณ\n\nผมไม่ได้เขียนมันนะ\nแต่ถ้าคุณอยากให้ผมเขียนบ้าง ผมเขียนได้ทั้งคืนเลย\n\n— L”\n\nรอยนิ้วมือตรงตัว L มีผงขาวติดอยู่ ฉันถูดู\nแป้งสาลี",
        en:"The steam hasn't cleared. This was written during the shower, then left to wait for someone to walk in.\n\n“Sorry I was the one who slid it under.\nI found it crumpled in the kitchen bin.\nI flattened it out and brought it to you.\n\nI didn't write it.\n\nBut if you'd like me to write you one, I could go all night.\n\n— L”\n\nThe fingerprints on the L are dusted with something white. I rub it.\nFlour."} },

  n_bar:{ title:{th:"บนบาร์ริมสระ",en:"On the pool bar"},
    body:{th:"แก้วสองใบ ใบหนึ่งมีรอยลิปสติกสีนู้ดของมีมี่ อีกใบสะอาดเอี่ยม\nที่เขี่ยบุหรี่มีมวนเดียว ยี่ห้อเกาหลี สูบไปสามในสี่แล้วดับเอง\n\nข้างแก้วมีกระดาษรองแก้วเขียนไว้ด้วยหมึกน้ำเงินเข้ม ลายมือเอียงขวา:\n\n“พี่มีมี่ ถ้าคืนนี้ผมพูดไม่ออกอีก พรุ่งนี้ผมจะเล่นมันในงานเลย\nแล้วก็จะไม่มองหน้าใครทั้งนั้น”\n\nด้านล่างเป็นลายมือมีมี่ ตอบกลับ:\n“เล่นเลย ฉันจะจัดที่นั่งให้เธอตรงหน้าเปียโนพอดี ❤️”",
        en:"Two glasses. One with Mimi's nude lipstick. One spotless.\nOne cigarette in the ashtray — Korean brand, smoked three-quarters down and left to go out.\n\nBeside them, a coaster written on in dark blue ink, right-leaning hand:\n\n“Mimi — if I can't say it tonight, I'll just play it at the wedding tomorrow.\nAnd then I'm not looking at anyone for the rest of the day.”\n\nUnderneath, Mimi's answer:\n“Play it. I'll seat her directly in front of the piano ❤️”"} },

  n_bride:{ title:{th:"โน้ตจากมีมี่ใต้ประตูห้อง 1",en:"Mimi's note under door 1"},
    body:{th:"กระดาษโน้ตแผ่นเล็ก ยัดใต้ประตูห้องเจ้าสาว ซึ่งล็อกอยู่และเงียบสนิท\n\n“ฉันหลับแล้วนะ พรุ่งนี้ต้องแต่งงาน\nแต่ถ้าเธออ่านอันนี้แปลว่าเธอยังไม่นอน แปลว่าเธอเจอการ์ดแล้ว\n\nฉันไม่บอกหรอกว่าใคร มันจะไม่สนุก\nบอกได้อย่างเดียว — คนคนนั้นซ้อมประโยคนี้มานานกว่าที่ฉันรู้จักเธออีก\n\nไปหาให้เจอ แล้วอย่าทำเป็นไม่รู้เรื่องเหมือนสามปีก่อน\n\nรักนะ (แต่ถ้าปลุกฉัน ฉันจะฆ่าเธอ)”",
        en:"A small note pushed under the bride's door, which is locked and completely silent.\n\n“I'm asleep. I'm getting married tomorrow.\nBut if you're reading this you're not asleep, which means you found the card.\n\nI'm not telling you who. That would ruin it.\nOne thing only — he has been rehearsing that sentence for longer than I've known you.\n\nGo and find him. And don't do the thing you did three years ago where you pretended not to notice.\n\nLove you (wake me and I will end you)”"} },

  n_polaroid:{ title:{th:"โพลารอยด์บนตู้เย็น",en:"A polaroid on the fridge"},

  onEnter:[{ once:"k1", say:B("ครัวยังอุ่น เตาอบเพิ่งปิดไปไม่นาน มีแป้งโรยอยู่บนเคาน์เตอร์เป็นทาง\n\nตีสองแล้ว ใครนวดแป้งตอนตีสอง","The kitchen is still warm. The oven was switched off recently. There's a trail of flour along the counter.\n\nIt's two in the morning. Who kneads dough at two in the morning.") }],
  hotspots:[
    { id:"fridge", x:1, y:62, w:20, h:36, label:B("ตู้เย็น","The fridge"), do:[
      { if:{noflag:"kfridge"}, scare:"h_leo" },
      { if:{noflag:"kfridge"}, say:B("ฉันเปิดตู้เย็น แสงขาวสาดออกมาเต็มหน้า\n\nแล้วก็เห็นว่ามีคนยืนอยู่อีกฝั่งของเกาะครัวมาตลอด ไม่ได้ใส่เสื้อ มือเปื้อนแป้ง\n\n“หิวเหรอ” เลโอถามเหมือนตีสองเป็นเวลาปกติของทุกคน “เดี๋ยวสิบนาทีมีขนมปัง”\n\nฉันปิดตู้เย็น แล้วลืมไปเลยว่าเปิดมาทำไม","I open the fridge. White light straight into my face.\n\nAnd then I see that someone has been standing on the other side of the island this whole time. No shirt. Flour on his hands.\n\n“Hungry?” Leo asks, like 2am is a normal hour for everyone. “Ten minutes and there's bread.”\n\nI close the fridge and forget entirely why I opened it.") },
      { if:{noflag:"kfridge"}, set:"kfridge" },
      { if:{flag:"kfridge"}, note:"n_polaroid" }] },
    { id:"calendar", x:10, y:24, w:9, h:21, label:B("ปฏิทินติดตู้เย็น","Calendar on the fridge"), do:[{ note:"n_calendar" }] },
    { id:"receipt", x:4, y:8, w:6, h:36, label:B("ใบเสร็จบนเคาน์เตอร์","A receipt on the counter"), do:[{ note:"n_receipt" }] },
    { id:"winecab", x:50, y:12, w:21, h:78, label:B("ตู้ไวน์กระจก","The wine cabinet"), do:[
      { if:{noflag:"e3"}, code:"wine_cab" },
      { if:{flag:"e3"}, say:B("ขวดยังอยู่ในนั้น ฉันไม่ได้หยิบออกมา\nเปิดมันคืนนี้ ก็เหมือนตอบแทนคนอื่นโดยที่เขาไม่ได้ถาม","The bottle is still in there. I didn't take it out.\nOpening it tonight would be answering for someone who hasn't asked yet.") }] },
    { id:"bin", x:26, y:88, w:11, h:11, label:B("ถังขยะ","The bin"), do:[
      { say:B("ขวดเปล่า เปลือกกุ้ง กระดาษเช็ดปาก\n\nแล้วก็กระดาษครีมหนาๆ อีกสองแผ่น ขยำแล้วโยนทิ้ง\nฉันคลี่ดู — เปล่า ไม่มีตัวหนังสือสักตัว เขียนแล้วไม่พอใจ ขยำ เขียนใหม่\n\nแผ่นที่สามคงเป็นแผ่นที่มาถึงมือฉัน","Empty bottles, prawn shells, napkins.\n\nAnd two sheets of heavy cream card, crushed into balls.\nI flatten one out — blank. Not a single word. Written, hated, crushed, started again.\n\nThe third attempt must be the one that reached my door.") }] },
    { id:"pantrydoor", x:73, y:16, w:7, h:64, kind:"door", label:B("ประตูห้องเก็บของ","Pantry door"), do:[
      { if:{lacks:"flashlight"}, say:B("ข้างในมืดสนิท ไฟชั้นล่างไม่ได้ต่อเข้าห้องนี้\nมือถือฉันแบต 4% ส่องได้สามวินาทีก็ดับ\n\nต้องหาไฟฉายจริงๆ ก่อน","Pitch black inside — this room isn't on the downstairs circuit.\nMy phone is at 4%; the torch lasts about three seconds.\n\nI need a real one.") },
      { if:{has:"flashlight"}, goto:"pantry" }] },
    { id:"back", x:26, y:8, w:19, h:78, kind:"door", label:B("กลับโถงทางเข้า","Back to the hall"), do:[{ goto:"foyer" }] }
  ]},

pantry:{ img:"s_pantry", name:B("ห้องเก็บของหลังครัว","The back pantry"),
  onEnter:[{ once:"p1", say:B("ลำแสงไฟฉายกวาดไปตามชั้น ขวดโหลเรียงกันเป็นแถวสะท้อนแสงกลับมาทีละใบ\nที่นี่กลิ่นเหมือนบ้านตายาย — น้ำตาลปี๊บกับกระดาษเก่า","The beam sweeps the shelves; jar after jar throws it back at me.\nIt smells like a grandparent's house in here — palm sugar and old paper.") }],
  hotspots:[
    { id:"fusebox", x:64, y:16, w:19, h:36, label:B("กล่องอะไหล่ไฟฟ้า","The electrical spares box"), do:[
      { if:{noflag:"gfuse"}, say:B("กล่องเหล็กเขียนด้วยเมจิกว่า “อะไหล่ — ห้ามเอาไปใช้กับอย่างอื่น”\nข้างในมีฟิวส์เซรามิกเรียงอยู่สี่ตัว ตัวหนึ่งเขียนกำกับว่า “ชั้นบน”","A steel box marked in marker: “SPARES — do not use for anything else.”\nFour ceramic fuses inside. One is labelled UPSTAIRS.") },
      { if:{noflag:"gfuse"}, take:"fuse" },
      { if:{noflag:"gfuse"}, set:"gfuse" },
      { if:{flag:"gfuse"}, say:B("เหลืออีกสามตัว เผื่อคืนไหนไฟดับอีก","Three left, for whichever night this happens again.") }] },
    { id:"nail", x:72, y:59, w:9, h:18, label:B("ตะปูแขวนกุญแจ","A nail with a key on it"), do:[
      { if:{noflag:"gkey"}, say:B("กุญแจสั้นสีทองแดงห้อยอยู่ตะปูตัวเดียว ป้ายหนังเขียนว่า DARKROOM\nด้านหลังป้ายมีลายมือเล็กๆ ว่า “ถ้าเธอมาหยิบเอง แปลว่าเธออยากรู้จริงๆ”","A short copper key on a single nail. Leather tag: DARKROOM.\nOn the back of the tag, in small handwriting: “if you came and took this yourself, you really do want to know.”") },
      { if:{noflag:"gkey"}, take:"key_dark" },
      { if:{noflag:"gkey"}, set:"gkey" },
      { if:{flag:"gkey"}, say:B("ตะปูว่างเปล่าแล้ว","The nail is bare now.") }] },
    { id:"shelf", x:46, y:10, w:19, h:86, label:B("ชั้นวางของ","The shelves"), do:[
      { say:B("โหลมะม่วงดอง เกลือทะเลสามกระปุก และกล่องกระดาษเขียนว่า “ของงานแต่ง — ห้ามแตะ”\n\nฉันแตะ ข้างในเป็นโคมกระดาษอีกยี่สิบใบ ยังไม่ได้จุด","Pickled mango, three tubs of sea salt, and a carton marked “WEDDING — do not touch.”\n\nI touch it. Twenty more paper lanterns inside, still unlit.") }] },
    { id:"back", x:21, y:8, w:22, h:88, kind:"door", label:B("กลับเข้าครัว","Back to the kitchen"), do:[{ goto:"kitchen" }] }
  ]},

terrace:{ img:"s_terrace", name:B("ระเบียงสระว่ายน้ำ","The pool terrace"),
  onEnter:[{ once:"t1", say:B("สระเรืองแสงฟ้าอยู่กลางความมืด เหมือนของที่ไม่ควรมีอยู่ตรงนี้\nขอบสระอีกฝั่งคือทะเลจริงๆ มองไม่เห็นเส้นแบ่ง","The pool glows blue in the middle of all that dark, like something that shouldn't be here.\nThe far edge just becomes sea. You can't see where one ends.") }],
  hotspots:[
    { id:"pool", x:1, y:52, w:39, h:47, label:B("สระว่ายน้ำ","The pool"), do:[
      { if:{noflag:"tpool"}, scare:"h_tarn" },
      { if:{noflag:"tpool"}, say:B("ฉันก้มลงจุ่มมือ น้ำอุ่นกว่าอากาศ\n\nแล้วผิวน้ำอีกฝั่งก็แตกออก\n\nธารโผล่ขึ้นมาห่างจากฉันสองเมตร สะบัดผม น้ำกระเซ็นเป็นวง\nเขามองฉันแป๊บหนึ่งแล้วยิ้มแบบคนที่ไม่เคยต้องคิดก่อนยิ้ม\n\n“ว่ายด้วยกันไหม” เขาถาม “น้ำอุ่นกว่าห้องนอนนะ”\n\nฉันบอกว่าเดี๋ยวก่อน เขาพยักหน้าแล้วดำกลับลงไปเฉยๆ ไม่ตื๊อสักคำ\nซึ่งแย่กว่าตื๊อเยอะ","I crouch and put my hand in. Warmer than the air.\n\nThen the surface breaks on the far side.\n\nTarn comes up two metres from me, shakes the water out of his hair.\nHe looks at me for a second and smiles like a man who has never once had to think before smiling.\n\n“Swim?” he says. “It's warmer than the bedrooms.”\n\nI say maybe later. He nods and just goes back under. Doesn't push, not one word.\n\nWhich is much worse than pushing.") },
      { if:{noflag:"tpool"}, set:"tpool" },
      { if:{flag:"tpool"}, say:B("ผิวน้ำนิ่งแล้ว เหลือแต่แสงฟ้าที่ยังไหวอยู่บนผนัง","The water's flat again. Only the blue light still moving on the wall.") }] },
    { id:"towel", x:33, y:59, w:14, h:12, label:B("ผ้าเช็ดตัวที่ทิ้งไว้","A dropped towel"), do:[
      { if:{noflag:"gtowel"}, say:B("ผ้าขาวของวิลล่า ยังชื้น พับไม่เป็นระเบียบเลย","A villa towel, still damp, not folded so much as abandoned.") },
      { if:{noflag:"gtowel"}, take:"towel" },
      { if:{noflag:"gtowel"}, set:"gtowel" }] },
    { id:"steps", x:47, y:65, w:10, h:22, label:B("รอยเท้าเปียกบนพื้นหิน","Wet footprints on the stone"), do:[
      { say:B("รอยเท้าเปล่าเปียกๆ เดินจากขอบสระ ผ่านหน้าฉัน แล้วมุ่งเข้าตัวบ้าน\nไม่ได้เดินไปทางโรงเก็บเรือ\n\nเดินเข้าบ้าน ขึ้นชั้นบน","Bare wet prints, from the pool edge, past where I'm standing, heading into the house.\nNot toward the boathouse.\n\nInto the house. Up.") }] },
    { id:"tobar", x:52, y:33, w:18, h:22, kind:"door", label:B("บาร์ริมสระ","The pool bar"), do:[{ goto:"poolbar" }] },
    { id:"topath", x:1, y:44, w:21, h:14, kind:"door", label:B("ทางเดินลงหาด","Path down to the beach"), do:[{ goto:"beachpath" }] },
    { id:"back", x:72, y:22, w:10, h:38, kind:"door", label:B("กลับเข้าห้องนั่งเล่น","Back inside"), do:[{ goto:"living" }] }
  ]},

poolbar:{ img:"s_poolbar", name:B("บาร์ริมสระ","The pool bar"),
  onEnter:[{ once:"pb1", say:B("จากุซซี่ยังเดินอยู่ ไอน้ำลอยขึ้นมาชนไฟราวเป็นสาย\nมีคนนั่งตรงนี้จนดึกจริงๆ แล้วเพิ่งลุกไป","The jacuzzi is still running, steam rising into the string lights.\nSomeone sat here very late. And left very recently.") }],
  hotspots:[
    { id:"glasses", x:67, y:55, w:12, h:30, label:B("แก้วสองใบกับที่เขี่ยบุหรี่","Two glasses and an ashtray"), do:[
      { closeup:"c_glass" }, { note:"n_bar" }] },
    { id:"ash", x:52, y:69, w:13, h:14, label:B("บุหรี่มวนเดียว","The one cigarette"), do:[
      { say:B("ยี่ห้อเกาหลี ซองบางๆ ที่หาซื้อในไทยไม่ได้\nสูบไปสามในสี่แล้วปล่อยให้ดับเอง ไม่ได้บี้ทิ้ง\n\nคนที่จุดบุหรี่แล้วลืมมันไป คือคนที่กำลังคิดเรื่องอื่นอยู่หนักมาก","Korean brand, the thin pack you can't buy here.\nSmoked three-quarters and left to go out on its own. Not stubbed.\n\nA man who lights a cigarette and forgets it is a man thinking hard about something else.") }] },
    { id:"jacuzzi", x:2, y:57, w:44, h:36, label:B("จากุซซี่","The jacuzzi"), do:[
      { say:B("น้ำร้อนจนกระจกรอบๆ เป็นฝ้า ขอบอ่างมีรอยมือเปียกสองรอย ห่างกันพอดีตัวคน\n\nฉันเอามือทาบดู\nรอยหนึ่งใหญ่กว่ามือฉันเยอะ","Hot enough to fog the glass. Two wet handprints on the rim, one person's width apart.\n\nI lay my hand over one.\nIt's much bigger than mine.") }] },
    { id:"back", x:37, y:45, w:14, h:14, kind:"door", label:B("กลับไประเบียงสระ","Back to the terrace"), do:[{ goto:"terrace" }] }
  ]},

beachpath:{ img:"s_beachpath", name:B("ทางเดินไม้ลงหาด","The boardwalk"),
  onEnter:[{ once:"bp1", say:B("ไม้กระดานเก่าจนนิ่ม เดินแล้วมันร้องทุกแผ่น\nหญ้าทะเลสองข้างสูงเลยเอว ลมพัดทีมันเอนลู่ไปทางเดียวกันหมด","The planks have gone soft with age; every one of them complains.\nSea grass higher than my waist on both sides, all of it leaning the same way.") }],
  hotspots:[
    { id:"lamp", x:66, y:24, w:14, h:36, label:B("เสาไฟข้างทาง","The leaning lamp post"), do:[
      { say:B("แมลงเมาแสงบินวนอยู่เป็นกลุ่ม\nมีคนเอาเทปกาวแปะกระดาษไว้ที่เสา ฝนชะจนเหลือแค่คำเดียว\n\n“…รอ”","Insects orbiting the bulb in a loose cloud.\nSomeone taped a note to the post. The rain has taken most of it. One word survives.\n\n“…waiting”") }] },
    { id:"tobeach", x:38, y:74, w:24, h:20, kind:"door", label:B("ลงไปที่หาด","Down to the sand"), do:[{ goto:"beach" }] },
    { id:"toboat", x:10, y:44, w:20, h:28, kind:"door", label:B("โรงเก็บเรือ","The boathouse"), do:[{ goto:"boathouse" }] },
    { id:"back", x:80, y:66, w:16, h:22, kind:"door", label:B("กลับขึ้นไประเบียง","Back up to the terrace"), do:[{ goto:"terrace" }] }
  ]},

beach:{ img:"s_beach", name:B("หาดหน้าวิลล่า","The beach"),
  onEnter:[{ once:"be1", say:B("กองไฟที่จุดกันตอนหัวค่ำเหลือแค่ถ่านแดงๆ\nเก้าอี้ผ้าใบสองตัวยังหันเข้าหากันอยู่ ไม่มีใครเก็บ","The bonfire from earlier is down to red coals.\nTwo canvas chairs are still angled toward each other. Nobody moved them back.") }],
  hotspots:[
    { id:"fire", x:38, y:48, w:26, h:26, label:B("กองไฟที่เหลือแต่ถ่าน","The dying fire"), do:[
      { if:{noflag:"gfilm"}, say:B("มีอะไรสีดำๆ งอๆ อยู่ริมกองถ่าน ฉันเขี่ยออกมาด้วยกิ่งไม้\n\nฟิล์ม 35 มม. ม้วนหนึ่ง ปลายข้างหนึ่งไหม้จนละลาย แต่ช่วงกลางยังใสอยู่\n\nคนที่โยนฟิล์มลงกองไฟ แล้วเอามือควักกลับออกมาทันที — เขาเสียใจภายในสองวินาที","Something black and curled at the edge of the coals. I hook it out with a stick.\n\nA roll of 35mm. One end melted. The middle still clear.\n\nSomebody threw this in and then reached straight back in for it. He regretted it inside two seconds.") },
      { if:{noflag:"gfilm"}, take:"film" },
      { if:{noflag:"gfilm"}, set:"gfilm" },
      { if:{flag:"gfilm"}, say:B("ถ่านเริ่มมอดแล้ว","The coals are nearly out.") }] },
    { id:"chairs", x:68, y:52, w:22, h:24, label:B("เก้าอี้ผ้าใบสองตัว","The two chairs"), do:[
      { say:B("ทรายรอบเก้าอี้ตัวหนึ่งเรียบ อีกตัวเป็นรอยส้นเท้าขุดลึก\nคนที่นั่งตัวนั้นนั่งไม่ติดที่ ขยับตลอด\n\nใต้เก้าอี้มีปากกาหมึกซึมตกอยู่ด้ามหนึ่ง ฝาหาย หมึกน้ำเงินเข้ม","The sand around one chair is smooth. Around the other, heels have dug two deep trenches.\nWhoever sat there could not sit still.\n\nA fountain pen has fallen under it. Cap missing. Dark blue ink.") }] },
    { id:"sea", x:14, y:34, w:24, h:24, label:B("ทะเล","The sea"), do:[
      { say:B("น้ำกำลังจะขึ้น รอยเท้าที่เดินมาเมื่อกี้จะหายภายในชั่วโมงเดียว\n\nสามปีก่อนฉันยืนตรงนี้ กับคนกลุ่มเดิม\nแล้วก็มีคนคนหนึ่งเดินมาข้างๆ อ้าปากจะพูด แล้วมีมี่ก็ตะโกนเรียกให้ไปถ่ายรูปพอดี\n\nฉันไม่เคยรู้ว่าเขาจะพูดอะไร ฉันก็ไม่เคยถาม","The tide's coming in. Every footprint from tonight will be gone within the hour.\n\nThree years ago I stood right here with the same people.\nAnd one of them came and stood beside me and opened his mouth to say something, and Mimi shouted for us to come and take the photo.\n\nI never found out what it was. I never asked either.") }] },
    { id:"back", x:44, y:82, w:20, h:16, kind:"door", label:B("กลับขึ้นทางเดินไม้","Back to the boardwalk"), do:[{ goto:"beachpath" }] }
  ]},

boathouse:{ img:"s_boathouse", name:B("โรงเก็บเรือ","The boathouse"),
  onEnter:[{ once:"bo1", say:B("ประตูไม้เปิดค้าง ไฟนีออนดวงเดียวห้อยอยู่กลางเพดาน\nกลิ่นแว็กซ์บอร์ด กลิ่นยาง กลิ่นเกลือ\n\nนี่คือห้องนอนของธาร เขาเลือกนอนตรงนี้แทนห้องในวิลล่า","The wooden door stands open, one strip light hanging from the beam.\nBoard wax, rubber, salt.\n\nThis is Tarn's room. He chose it over a bedroom in the villa.") }],
  hotspots:[
    { id:"bench", x:8, y:58, w:24, h:16, label:B("โต๊ะทำงาน","The workbench"), do:[
      { if:{noflag:"gfl"}, say:B("ไฟฉายดำน้ำวางอยู่ตรงกลางโต๊ะ ตั้งไว้แบบตั้งใจ หันหัวไปทางประตู\nมีกระดาษแปะไว้ใต้มัน:\n\n“ห้องเก็บของหลังครัวมันมืดสนิท เอาไปใช้เลย\nเดี๋ยวเจอกัน — ธาร”\n\nเขาเดาไว้แล้วว่าฉันจะออกมาหาอะไรสักอย่างคืนนี้","A dive torch sits in the middle of the bench, placed deliberately, pointing at the door.\nA note taped under it:\n\n“That pantry is properly dark. Just take it.\nSee you around — Tarn”\n\nHe already knew I'd come out looking for something tonight.") },
      { if:{noflag:"gfl"}, take:"flashlight" },
      { if:{noflag:"gfl"}, set:"gfl" },
      { if:{flag:"gfl"}, say:B("บนโต๊ะเหลือแต่แว็กซ์กับเชือก","Just wax and rope left on the bench.") }] },
    { id:"logbook", x:26, y:72, w:24, h:25, label:B("สมุดจดปกยาง","The rubber-covered logbook"), do:[{ note:"n_tarnlog" }] },
    { id:"wetsuit", x:75, y:29, w:24, h:50, label:B("ชุดดำน้ำที่แขวนอยู่","The wetsuit on the hook"), do:[
      { say:B("ยังหยดน้ำอยู่ ใต้มันมีวงน้ำบนพื้นกว้างเท่าจานข้าว\n\nเขาเพิ่งขึ้นจากน้ำไม่ถึงชั่วโมง แล้วก็ลงไปอีกรอบ\n\nคนที่ว่ายน้ำตอนตีสองคนเดียว ไม่ได้ว่ายเพื่อออกกำลังกาย","Still dripping. A puddle the size of a dinner plate beneath it.\n\nHe was out of the water less than an hour ago. Then went back in.\n\nNobody swims alone at 2am for the exercise.") }] },
    { id:"boards", x:51, y:28, w:19, h:39, label:B("บอร์ดเซิร์ฟ","The surfboards"), do:[
      { say:B("บอร์ดหกตัว ห้าตัวเรียงตามขนาด ตัวที่หกวางแยกออกมา สีซีดกว่าเพื่อน\nข้างลำเขียนด้วยปากกาเคมีเลือนๆ ว่าชื่อฉัน\n\nฉันเคยยืมมันครั้งเดียว สามปีก่อน สองชั่วโมง\nเขาไม่เคยเอามันกลับเข้าแถว","Six boards. Five racked by size. The sixth is set apart, more faded than the rest.\nAlong the rail, in half-gone marker, is my name.\n\nI borrowed it once. Three years ago. For two hours.\n\nHe never put it back in the row.") }] },
    { id:"back", x:27, y:36, w:21, h:24, kind:"door", label:B("ออกไปทางเดินไม้","Back to the boardwalk"), do:[{ goto:"beachpath" }] }
  ]},

hall2:{ img:"s_hall2", name:B("ทางเดินชั้นสอง","The second-floor corridor"),
  onEnter:[{ once:"h1", say:B("ไฟติดครบทุกดวงแล้ว ทางเดินยาวกว่าที่จำได้\nประตูสี่บาน ห้องหนึ่งล็อกและเงียบ อีกสามห้องมีเสียงคนละอย่าง\n\nซ้ายสุดมีเสียงเปียโนแผ่วมาก\nขวาสุดมีแสงแดงลอดใต้ประตู","Every light is on now. The corridor is longer than I remembered.\nFour doors. One locked and silent. The other three each making their own sound.\n\nFar left: a piano, very quiet.\nFar right: red light under the door.") }],
  hotspots:[
    { id:"camera", x:6, y:52, w:14, h:26, label:B("กล้องบนขาตั้งที่มุมทางเดิน","A camera on a tripod in the corner"), do:[
      { say:B("กล้องตัวเล็กบนขาตั้ง ตั้งหันไปตามแนวทางเดิน ไฟสีแดงกะพริบช้าๆ\nจอหลังเขียนว่า TIME-LAPSE · REC · 6h 41m\n\nมันถ่ายมาตั้งแต่ก่อนเที่ยงคืน\nมันเห็นทุกคนที่เดินผ่านทางเดินนี้คืนนี้","A small camera on a tripod, aimed straight down the corridor, a red light pulsing slowly.\nThe rear screen reads TIME-LAPSE · REC · 6h 41m\n\nIt's been running since before midnight.\nIt has seen everyone who walked down this corridor tonight.") },
      { set:"saw_cam" }] },
    { id:"window", x:82, y:26, w:16, h:38, label:B("หน้าต่างปลายทางเดิน","The window at the end"), do:[
      { if:{noflag:"hwin"}, scare:"h_shadow" },
      { if:{noflag:"hwin"}, say:B("ม่านผ้าลินินพองออกมาแล้วนิ่งลง\n\nข้างหลังม่านมีเงาคนยืนอยู่ ไหล่กว้าง มือยกค้างเหมือนกำลังจะเคาะอะไรสักอย่าง\n\nฉันยืนนิ่ง เงานั้นก็ยืนนิ่ง\nแล้วมันก็ค่อยๆ ลดมือลง แล้วเดินหายไปทางบันได ไม่พูดอะไรเลยสักคำ\n\nหน้าต่างบานนั้นปิดล็อกสนิท พื้นใต้มันเปียกเป็นวงกว้าง แห้งไปครึ่งแล้ว","The linen curtain swells outward, then settles.\n\nBehind it, the shape of a man. Broad shoulders. One hand raised, as if about to knock on something.\n\nI stay still. So does he.\nThen the hand lowers, and he walks away toward the stairs without a single word.\n\nThe window itself is shut and latched. The floor beneath it is wet in a wide arc, already half dry.") },
      { if:{noflag:"hwin"}, set:"hwin" },
      { if:{flag:"hwin"}, say:B("หน้าต่างล็อกอยู่ พื้นใต้มันเกือบแห้งแล้ว","Latched. The floor under it is nearly dry now.") }] },
    { id:"door1", x:22, y:30, w:14, h:40, label:B("ประตูห้อง 1 — ห้องมีมี่","Door 1 — Mimi's room"), do:[
      { if:{noflag:"hbride"}, say:B("ล็อก เงียบสนิท ไม่มีแสงลอดออกมาเลย\nแต่มีกระดาษโน้ตแผ่นเล็กยัดออกมาจากใต้ประตู — ยัดออก ไม่ใช่ยัดเข้า","Locked. Silent. No light at all.\nBut a small note has been pushed out from under it — out, not in.") },
      { if:{noflag:"hbride"}, note:"n_bride" },
      { if:{noflag:"hbride"}, set:"hbride" },
      { if:{flag:"hbride"}, say:B("เธอหลับจริงๆ ปล่อยให้หลับเถอะ พรุ่งนี้เธอต้องแต่งงาน","She really is asleep. Let her be. She's getting married tomorrow.") }] },
    { id:"myroom", x:38, y:30, w:14, h:40, kind:"door", label:B("ประตูห้อง 2 — ห้องฉัน","Door 2 — my room"), do:[{ goto:"myroom" }] },
    { id:"music", x:54, y:30, w:14, h:40, kind:"door", label:B("ประตูห้อง 3 — สตูดิโอ","Door 3 — the studio"), do:[{ goto:"music" }] },
    { id:"darkroom", x:68, y:30, w:14, h:40, kind:"door", label:B("ประตูห้อง 4 — ห้องมืด","Door 4 — the darkroom"), do:[
      { if:{lacks:"key_dark"}, say:B("ล็อก มีแสงแดงลอดใต้ประตูออกมา\nป้ายแขวนเขียนว่า “กำลังล้างฟิล์ม — เปิดประตูแล้วงานพัง”\n\nต้องมีกุญแจก่อน","Locked, red light bleeding under the door.\nA sign hangs on it: “DEVELOPING — open this and you ruin it.”\n\nI need the key.") },
      { if:{has:"key_dark"}, goto:"darkroom" }] },
    { id:"bath", x:2, y:28, w:12, h:34, kind:"door", label:B("ห้องน้ำรวมปลายทางเดิน","The bathroom at the end"), do:[{ goto:"bath" }] },
    { id:"roofstair", x:46, y:8, w:20, h:16, kind:"door", label:B("บันไดขึ้นดาดฟ้า","Stairs to the roof"), do:[
      { if:{notready:1}, say:B("บันไดเหล็กแคบๆ ขึ้นไปดาดฟ้า ลมข้างบนแรงจนได้ยินตั้งแต่ตรงนี้\n\nยังไม่ถึงตีห้า\nและถ้าฉันขึ้นไปตอนนี้ ฉันก็ยังไม่รู้ว่าจะเจอใคร — แปลว่าฉันจะทำแบบเดิมกับสามปีก่อนอีกรอบ\n\nต่อเรื่องให้ครบก่อน (ยังต่อได้อีก — เปิดไดอารี่คืนนี้)","A narrow steel stair to the roof. The wind up there is loud enough to hear from here.\n\nIt isn't 5am yet.\nAnd if I go up now I still don't know who I'd be meeting — which means doing exactly what I did three years ago.\n\nPut it together first. (Open tonight's diary.)") },
      { if:{ready:1}, say:B("ตีห้าสี่นาที ฟ้ายังไม่สว่าง แต่มันเปลี่ยนสีแล้ว\n\nฉันรู้แล้วว่าใครเขียน\nฉันรู้แล้วว่าใครเอามาส่ง\nและฉันรู้แล้วว่าใครขึ้นมาปิดหน้าต่างให้เฉยๆ โดยไม่บอกใคร\n\nขึ้นไปเถอะ","04:56. Not light yet, but the sky has changed colour.\n\nI know who wrote it.\nI know who delivered it.\nAnd I know who came up just to close a window and never mentioned it.\n\nGo up.") },
      { if:{ready:1}, goto:"rooftop" }] },
    { id:"down", x:32, y:80, w:20, h:16, kind:"door", label:B("ลงบันไดวน","Down the spiral stair"), do:[{ goto:"foyer" }] }
  ]},

myroom:{ img:"s_myroom", name:B("ห้อง 2 — ห้องฉัน","Room 2 — mine"),
  onEnter:[{ once:"m1", say:B("ห้องเย็นกว่าที่ควรจะเป็น เพราะพื้นยังเปียกอยู่ตรงใต้หน้าต่าง\nแต่หน้าต่างปิดล็อกแล้ว\n\nฉันไม่ได้ปิดมัน","The room is colder than it should be, because the floor under the window is still wet.\nBut the window is shut and latched.\n\nI didn't shut it.") }],
  hotspots:[
    { id:"card", x:36, y:74, w:22, h:18, label:B("การ์ดใต้ประตู","The card under the door"), do:[
      { if:{noflag:"e1"}, closeup:"c_card" },
      { if:{noflag:"e1"}, note:"n_card" },
      { if:{noflag:"e1"}, ev:"E1" },
      { if:{noflag:"e1"}, set:"e1" },
      { if:{flag:"e1"}, say:B("ฉันอ่านมันไปแล้วหกรอบ ตัวหนังสือไม่เปลี่ยน","I've read it six times. The words don't change.") }] },
    { id:"floor", x:60, y:70, w:26, h:22, label:B("รอยเท้าเปียกบนพื้น","Wet footprints on the floor"), do:[
      { if:{noflag:"e2"}, note:"n_footprint" },
      { if:{noflag:"e2"}, ev:"E2" },
      { if:{noflag:"e2"}, set:"e2" },
      { if:{flag:"e2"}, say:B("รอยเท้าเริ่มแห้งแล้ว เหลือแต่วงทรายจางๆ","The prints are drying. Just faint rings of sand left.") }] },
    { id:"water", x:70, y:44, w:16, h:18, label:B("แก้วน้ำกับเปลือกหอย","The glass of water and the shell"), do:[
      { say:B("น้ำเต็มแก้ว ไม่มีฟองอากาศแล้ว แปลว่ารินทิ้งไว้นานพอสมควร\nข้างแก้วมีเปลือกหอยเบี้ยเล็กๆ วางไว้หนึ่งอัน วางตั้งใจ ไม่ใช่หล่น\n\nสามปีก่อนมีคนเก็บหอยแบบนี้ให้ฉันทั้งกำมือ แล้วบอกว่า “อันนี้หายาก อย่าทำหาย”\nฉันทำหายภายในอาทิตย์เดียว","Full to the brim, no bubbles left — it's been sitting a while.\nBeside it, one small cowrie shell, set down on purpose, not dropped.\n\nThree years ago somebody put a whole handful of these in my palm and said, “these are rare, don't lose them.”\nI lost them inside a week.") }] },
    { id:"suitcase", x:14, y:56, w:20, h:24, label:B("กระเป๋าเดินทาง","My suitcase"), do:[
      { say:B("เปิดอ้าอยู่ ไม่มีใครรื้อ\n\nชุดที่เตรียมใส่ไปงานพรุ่งนี้ยังแขวนอยู่ในถุง\nฉันซื้อมันสัปดาห์ที่แล้ว ตอนซื้อฉันคิดว่าซื้อให้ตัวเอง","Open. Nobody's been through it.\n\nThe dress for tomorrow is still hanging in its bag.\nI bought it last week. When I bought it I told myself it was for me.") }] },
    { id:"back", x:44, y:12, w:18, h:16, kind:"door", label:B("ออกไปทางเดิน","Out to the corridor"), do:[{ goto:"hall2" }] }
  ]},

music:{ img:"s_music", name:B("ห้อง 3 — สตูดิโอ","Room 3 — the studio"),
  onEnter:[
    { once:"mu1", scare:"h_jun" },
    { once:"mu1b", say:B("ฉันเปิดประตูโดยไม่เคาะ เพราะคิดว่าไม่มีใคร\n\nจุนนั่งอยู่ที่เปียโน หันมามองพอดี\nเสื้อไหมดำปลดกระดุมลงมาสามเม็ด มือซ้ายยังวางค้างอยู่บนคีย์\n\nเขาไม่ตกใจ ไม่ลุก ไม่พูดว่าทำไมถึงเข้ามา\nเขาแค่มองฉันประมาณสามวินาที ซึ่งนานกว่าที่คนปกติเขามองกัน\n\nแล้วเขาก็ลุกเดินออกไปเฉยๆ เอาเสื้อคลุมพาดแขนไป\nผ่านฉันในระยะที่ใกล้เกินความจำเป็นสำหรับประตูกว้างขนาดนั้น",
      "I open the door without knocking, because I assumed it was empty.\n\nJun is at the piano, and he turns at exactly the right moment.\nBlack silk shirt open three buttons down. His left hand still resting on the keys.\n\nHe isn't startled. He doesn't stand. He doesn't ask why I came in.\nHe just looks at me for about three seconds, which is longer than people look at each other.\n\nThen he gets up and walks out, jacket over his arm.\nPassing closer than a doorway that wide actually requires.") }],
  hotspots:[
    { id:"sheet", x:44, y:34, w:20, h:20, label:B("โน้ตเพลงบนแท่น","The score on the stand"), do:[
      { if:{noflag:"ranat_ok"}, say:B("โน้ตเขียนมือ หมึกน้ำเงินเข้ม มีห้าตัวถูกวงด้วยดินสอ เขียนกำกับว่า “ท่อนนี้ก่อน”\n\nวงไว้ที่ตัว มี — เร — โด — ซอล — มี\n\nนับจากคีย์ซ้ายสุดของช่วงที่เขาทำเครื่องหมายไว้ ก็คือ 3 – 2 – 1 – 5 – 3","Hand-ruled, dark blue ink. Five notes circled in pencil, marked “this bar first.”\n\nThe circles fall on: mi — re — do — sol — mi\n\nCounted from the leftmost key of the range he's marked: 3 – 2 – 1 – 5 – 3.") },
      { if:{flag:"ranat_ok"}, say:B("ห้าตัวนั้นยังวงอยู่ ตอนนี้ฉันรู้แล้วว่ามันเป็นประโยคอะไร","Those five are still circled. Now I know what sentence they are.") }] },
    { id:"piano", x:16, y:44, w:26, h:32, label:B("เปียโน","The piano"), do:[
      { if:{noflag:"ranat_ok"}, say:B("ฝาเปียโนยังเปิดอยู่ ในตู้ข้างเปียโนมีลิ้นชักที่ล็อกด้วยกลไก\nเห็นสายลวดโยงจากลิ้นชักไปที่กลไกใต้คีย์ — เล่นโน้ตให้ถูก ลิ้นชักถึงจะเปิด\n\nคนที่ทำล็อกแบบนี้ ไม่ได้กันขโมย เขากันคนที่ไม่ได้ตั้งใจฟัง","The lid is still up. A drawer in the cabinet beside it is locked by some kind of mechanism.\nThere's a wire running from the drawer to a linkage under the keys — play the right notes and it opens.\n\nA man who builds a lock like this isn't keeping out thieves. He's keeping out people who weren't listening.") },
      { if:{noflag:"ranat_ok"}, puzzle:1 },
      { if:{flag:"ranat_ok", noflag:"e5"}, closeup:"c_sheet" },
      { if:{flag:"ranat_ok", noflag:"e5"}, note:"n_lyrics" },
      { if:{flag:"ranat_ok", noflag:"e5"}, ev:"E5" },
      { if:{flag:"ranat_ok", noflag:"e5"}, set:"e5" },
      { if:{flag:"e5"}, say:B("ลิ้นชักเปิดค้างอยู่ ในนั้นว่างเปล่าแล้ว","The drawer is still open. Empty now.") }] },
    { id:"desk", x:70, y:46, w:22, h:24, label:B("มิกเซอร์กับโพสต์อิท","The desk and its post-its"), do:[{ note:"n_junnote" }] },
    { id:"window", x:86, y:20, w:14, h:26, label:B("หน้าต่างมองออกทะเล","The window over the sea"), do:[
      { say:B("ไมโครโฟนตัวหนึ่งตั้งหันออกไปนอกหน้าต่าง ไม่ได้หันเข้าห้อง\nในโปรเจกต์บนจอมีไฟล์ชื่อ “คลื่น_ตี3_เทค14”\n\nเทคที่สิบสี่ ของเสียงคลื่น\n\nคนที่อัดเสียงคลื่นสิบสี่รอบตอนตีสาม ไม่ได้กำลังอัดเสียงคลื่น","One microphone is aimed out of the window, not into the room.\nIn the session on screen there's a file called “waves_3am_take14.”\n\nTake fourteen. Of the sea.\n\nA man recording the sea fourteen times at 3am is not recording the sea.") }] },
    { id:"back", x:44, y:82, w:18, h:16, kind:"door", label:B("ออกไปทางเดิน","Out to the corridor"), do:[{ goto:"hall2" }] }
  ]},

darkroom:{ img:"s_darkroom", name:B("ห้อง 4 — ห้องมืด","Room 4 — the darkroom"),
  onEnter:[{ once:"d1", say:B("ไฟแดงดวงเดียว ทุกอย่างในห้องเป็นสีเดียวกันหมด\nกลิ่นน้ำยาแสบจมูก และในนั้นไม่มีใครอยู่\n\nเขาเปิดไฟแดงทิ้งไว้ แต่ไม่ได้อยู่ล้างอะไรเลย","One red bulb. Everything in the room is the same colour.\nThe chemicals sting. And there's nobody in here.\n\nHe left the red light on and then didn't develop anything.") }],
  hotspots:[
    { id:"enlarger", x:34, y:38, w:26, h:30, label:B("เครื่องอัดขยาย","The enlarger"), do:[
      { if:{lacks:"film"}, say:B("เครื่องพร้อมใช้ น้ำยาผสมไว้แล้วในถาด ยังไม่ตกตะกอน\nขาดอย่างเดียวคือฟิล์ม\n\nถ้ามีฟิล์มสักม้วน ฉันจะได้เห็นว่ากล้องตัวนั้นเห็นอะไร","Set up and ready, trays already mixed and not yet settled.\nThe only thing missing is film.\n\nWith a roll, I could see what that camera saw.") },
      { if:{has:"film", noflag:"e4"}, say:B("ฉันคลี่ฟิล์มออก ส่วนที่ไม่ไหม้ยังใช้ได้ประมาณสิบเฟรม\n\nกดสวิตช์ นับในใจ แล้วหย่อนลงถาด\n\nภาพค่อยๆ ลอยขึ้นมาจากกระดาษขาว เหมือนของที่จมอยู่แล้วโผล่กลับมา","I unroll it. About ten usable frames survived the fire.\n\nSwitch on. Count in my head. Into the tray.\n\nThe image comes up out of the white paper slowly, like something surfacing.") },
      { if:{has:"film", noflag:"e4"}, closeup:"c_photo" },
      { if:{has:"film", noflag:"e4"}, note:"n_photo" },
      { if:{has:"film", noflag:"e4"}, ev:"E4" },
      { if:{has:"film", noflag:"e4"}, set:"e4" },
      { if:{flag:"e4"}, say:B("รูปยังหนีบอยู่บนสาย น้ำหยดติ๋งๆ ลงถาด","The print is still on the line, dripping into the tray.") }] },
    { id:"book", x:68, y:52, w:20, h:22, label:B("สมุดงานถ่ายภาพ","The job book"), do:[{ note:"n_leobook" }] },
    { id:"line", x:16, y:22, w:30, h:22, label:B("สายแขวนรูป","The drying line"), do:[

rooftop:{ img:"s_rooftop", name:B("ดาดฟ้า · 05:00","The roof · 05:00"),
  onEnter:[{ once:"r1", say:B("ลมข้างบนแรงกว่าที่คิด แต่ไม่หนาว\n\nฟ้ายังไม่สว่าง มันแค่เปลี่ยนจากสีน้ำเงินเข้มเป็นสีน้ำเงินที่มีสีส้มปนอยู่ข้างล่างสุด\nทะเลนิ่งจนดูเหมือนพื้น\n\nโคมแก้วใบเดียวยังติดอยู่ มีคนขึ้นมาจุดไว้ก่อนหน้านี้\n\nและมีคนยืนรออยู่ตรงราวขอบดาดฟ้าจริงๆ หันหลังให้ฉัน","The wind up here is stronger than I expected, but it isn't cold.\n\nThe sky isn't light yet. It's just gone from deep blue to a blue with orange underneath it.\nThe sea is so flat it looks like floor.\n\nOne glass lantern is still burning. Somebody came up and lit it earlier.\n\nAnd somebody is standing at the rail, with his back to me.") }],
  hotspots:[
    { id:"lantern", x:74, y:52, w:16, h:22, label:B("โคมแก้ว","The glass lantern"), do:[
      { say:B("เทียนข้างในเหลือครึ่งนิ้ว เหมือนโคมที่มีมี่จุดไว้หน้าประตู\n\nแปลว่าคนที่ขึ้นมาจุดโคมนี้ เดินผ่านหน้าบ้านแล้วหยิบเทียนมาด้วย\nเขาขึ้นมาเตรียมตั้งแต่ก่อนฉันจะออกตามหาเขาเสียอีก","Half an inch of candle left, same as the lantern by the front door.\n\nSo whoever came up here to light this walked past the entrance and took a candle with him.\nHe was up here setting it up before I even started looking for him.") }] },
    { id:"edge", x:14, y:46, w:22, h:26, label:B("ราวขอบดาดฟ้า","The rail"), do:[
      { say:B("จากตรงนี้เห็นทุกที่ที่ฉันเดินมาทั้งคืน\nสระที่ยังเรืองแสง กองไฟที่มอดแล้ว โรงเก็บเรือที่ไฟยังติด\n\nสามปีก่อนฉันไม่ได้หันไปถามว่า “จะพูดอะไรเหรอ”\nคืนนี้ฉันเดินไล่ทั้งบ้านเพื่อจะไม่ต้องถามคำนั้นอีก","From up here I can see everywhere I've been tonight.\nThe pool still glowing. The fire gone out. The boathouse light still on.\n\nThree years ago I didn't turn around and say “what were you going to say?”\nTonight I walked through an entire house so I wouldn't have to ask it again.") }] },
    { id:"meet", x:40, y:34, w:24, h:40, label:B("เดินเข้าไปหา","Walk toward him"), do:[

const ENDINGS = {

jun_full:{ img:"e_two",
  title:{th:"จบแบบสมบูรณ์ · “จุน”",en:"TRUE ENDING · “Jun”"},
  body:{th:"ฉันเดินไปยืนข้างเขา ไม่พูดอะไรสักคำ\n\nจุนไม่หันมาทันที เขามองทะเลอีกสักพัก แล้วถึงพูดโดยไม่หันหน้า\n“ผมไม่คิดว่าคุณจะมา”\n\n“ฉันเจอโน้ตเพลง” ฉันบอก “แล้วก็เจอลายมือ แล้วก็เจอขวดในตู้ไวน์ แล้วก็เจอที่เขี่ยบุหรี่ที่คุณลืมทิ้งไว้ที่บาร์”\n\nเขาหลับตาแป๊บหนึ่ง เหมือนคนที่ซ้อมมาสามปีแล้วบทตกหมดในวินาทีเดียว\n\n“ผมเขียนแล้วขยำทิ้งสองรอบ รอบที่สามผมโยนลงถังขยะในครัวเหมือนกัน” เขาพูด “ผมไม่ได้ตั้งใจให้คุณได้อ่านมันด้วยซ้ำ”\n\n“ฉันรู้” ฉันบอก “เลโอเป็นคนเอามาให้ฉัน เขาเขียนบอกไว้บนกระจกด้วย”\n\nจุนหัวเราะออกมาสั้นๆ ครั้งเดียว เสียงเบามาก แล้วก็เงียบไปนาน\n\n“สามปีก่อน ตรงหาดข้างล่างนั่น” เขาพูดในที่สุด “ผมกำลังจะบอกคุณว่าผมไม่ได้ย้ายไปโซลเพราะงาน”\n\nฟ้าสว่างขึ้นหนึ่งระดับพอดีตอนที่เขาหันมามอง\n\nเขาไม่ได้ก้าวเข้ามาหา เขาแค่หันมา แล้วรอ\nเหมือนคนที่ตั้งใจแล้วว่าคราวนี้จะไม่เป็นฝ่ายเดินเข้ามาเอง เพราะครั้งที่แล้วเขาเดินเข้ามาแล้วไม่มีอะไรเกิดขึ้น\n\nฉันเป็นคนก้าวเอง\n\n— ตีห้าสิบเอ็ดนาที ที่วิลล่ามารีน่า\nงานแต่งของมีมี่เริ่มอีกสิบสองชั่วโมง\nและมีคนหนึ่งจะได้เล่นเพลงที่เขาแต่งไว้สามปี ต่อหน้าคนที่มันถูกแต่งให้",
      en:"I go and stand beside him. I don't say anything.\n\nJun doesn't turn straight away. He watches the water a while longer, then speaks without looking over.\n“I didn't think you'd come.”\n\n“I found the score,” I say. “And then the handwriting. And then the bottle in the wine cabinet. And then the cigarette you forgot at the bar.”\n\nHe closes his eyes for a second, like a man who rehearsed for three years and lost every line at once.\n\n“I wrote it and crushed it twice,” he says. “The third one went in the kitchen bin too. You weren't supposed to read it at all.”\n\n“I know. Leo brought it up to me. He wrote it on the mirror.”\n\nJun laughs — once, very quietly — then says nothing for a long time.\n\n“Three years ago, down there on that beach,” he says finally, “I was about to tell you I wasn't moving to Seoul for work.”\n\nThe sky comes up exactly one shade as he turns around.\n\nHe doesn't step toward me. He just turns, and waits.\nLike someone who decided that this time he wouldn't be the one crossing the distance — because last time he crossed it and nothing happened.\n\nSo I cross it.\n\n— 05:11, Villa Marina.\nMimi's wedding starts in twelve hours.\nAnd someone is going to play a song he's been carrying for three years, in front of the person it was written for."} },

jun_partial:{ img:"e_alone",
  title:{th:"จบแบบไม่สมบูรณ์ · “จุน”",en:"PARTIAL ENDING · “Jun”"},
  body:{th:"ฉันเดินไปหาเขา และฉันเลือกถูก\n\nแต่พอเขาถามว่า “คุณรู้ได้ยังไง” ฉันตอบได้แค่ครึ่งเดียว\n\nฉันไม่รู้ว่าใครเอาการ์ดมาส่ง ฉันเลยพูดเหมือนกับว่าเขาเป็นคนเอามาเอง\nฉันไม่รู้ว่าใครขึ้นมาปิดหน้าต่างให้ ฉันเลยพูดถึงรอยเท้าเปียกแบบระแวงๆ\n\nจุนฟังจนจบ แล้วพยักหน้าช้าๆ\n“งั้นคุณก็ยังไม่ได้มาหาผมจริงๆ” เขาพูดเบามาก “คุณมาเช็คว่าใช่ผมรึเปล่า”\n\nเขาไม่ได้โกรธ นั่นแหละที่แย่\n\nเขายิ้มนิดหนึ่ง แล้วบอกว่าเดี๋ยวเจอกันในงานพรุ่งนี้ แล้วก็เดินลงบันไดไป\nพรุ่งนี้เขาเล่นเพลงนั้นจริงๆ เล่นสวยมากด้วย\nแล้วก็ไม่มองมาทางฉันเลยสักครั้งเดียวตลอดงาน\n\n(ลองใหม่ แล้วเก็บเบาะแสให้ครบทั้งหกอย่าง — คุณต้องรู้ให้ครบว่าคืนนั้นใครทำอะไรบ้าง)",
      en:"I walk over to him, and I choose right.\n\nBut when he asks “how did you know,” I only have half an answer.\n\nI don't know who delivered the card, so I talk as if he brought it himself.\nI don't know who closed my window, so I mention the wet footprints like an accusation.\n\nJun listens to all of it, then nods slowly.\n“So you didn't actually come to find me,” he says, very quietly. “You came to check whether it was me.”\n\nHe isn't angry. That's the bad part.\n\nHe smiles a little, says he'll see me at the wedding, and goes down the stairs.\nHe does play the song the next day. He plays it beautifully.\n\nAnd he does not look at me once, the entire evening.\n\n(Try again — find all six clues. You need to know everything that happened tonight, not just the ending.)"} },

leo:{ img:"e_dawn",
  title:{th:"จบแบบผิดคน · “เลโอ”",en:"WRONG ENDING · “Leo”"},
  body:{th:"ฉันเดินไปหาเขา\n\nเลโอหันมาก่อนที่ฉันจะพูดอะไรด้วยซ้ำ แล้วก็รู้ทันทีจากหน้าฉัน\n\nเขาไม่ปฏิเสธ เขายิ้มก่อนเลย ยิ้มแบบคนที่รู้ตัวว่ากำลังจะทำสิ่งที่ถูกต้องแล้วก็จะเสียดายมันไปทั้งปี\n\n“ผมอยากพูดว่าใช่นะ” เขาบอก “ผมอยากมาก”\n\nแล้วเขาก็ล้วงกระเป๋าเอากระดาษครีมขยำอีกแผ่นออกมา แผ่นที่หนึ่งกับแผ่นที่สอง ที่เขาเก็บไว้จากถังขยะ\n\n“ลายมือผมไม่สวยขนาดนี้” เขาพูด “แล้วผมก็ไม่มีปัญญาซ้อมประโยคเดียวสามปีหรอกครับ ผมพูดทุกอย่างที่คิดภายในสามวินาทีเสมอ นั่นแหละปัญหาของผม”\n\nเขาชี้คางไปทางบันได\n“เขาอยู่ในสตูดิโอ นั่งอยู่ตรงนั้นตั้งแต่ตีสองแล้ว รอฟังว่าจะมีเสียงคนเดินขึ้นดาดฟ้าไหม”\n\nแล้วเขาก็หัวเราะ ตบไหล่ฉันเบาๆ แล้วเดินลงไปเอง\nโดยไม่รอให้ฉันขอโทษ\n\n(เลโอเป็นคนเอาการ์ดมาส่ง ไม่ใช่คนเขียน — ลองใหม่)",
      en:"I walk over to him.\n\nLeo turns before I've said anything, and reads it off my face immediately.\n\nHe doesn't deny it. He smiles first — the smile of a man who knows he's about to do the right thing and regret it for a year.\n\n“I would love to say yes,” he says. “I would really love to.”\n\nThen he digs two crushed cream cards out of his pocket. The first and second attempts, saved out of the bin.\n\n“My handwriting isn't that good,” he says. “And I couldn't rehearse one sentence for three years if you paid me. I say everything I think within three seconds. That's my whole problem.”\n\nHe tips his chin at the stairs.\n“He's in the studio. Been sitting there since two, listening for footsteps on the roof stairs.”\n\nThen he laughs, taps my shoulder, and goes down himself.\nWithout waiting for me to apologise.\n\n(Leo delivered the card. He didn't write it. Try again.)"} },

tarn:{ img:"e_dawn",
  title:{th:"จบแบบผิดคน · “ธาร”",en:"WRONG ENDING · “Tarn”"},
  body:{th:"ฉันเดินไปหาเขา\n\nธารหันมา ยิ้มกว้างเหมือนเดิม แล้วก็เงียบไปนานผิดปกติ\n\n“การ์ดไม่ใช่ผมนะ” เขาบอกตรงๆ เพราะเขาพูดตรงเสมอ “ผมขึ้นไปห้องคุณจริง แต่ผมขึ้นไปปิดหน้าต่าง ฝนมันสาดเข้าไปครึ่งห้องแล้ว”\n\n“แล้วแก้วน้ำล่ะ” ฉันถาม\n\n“ก็คุณตื่นมากินน้ำตอนตีสามทุกคืนตั้งแต่ปีสองแล้วนี่” เขาพูดเหมือนมันเป็นข้อมูลธรรมดาที่ใครก็รู้ “ผมเลยรินไว้ให้”\n\nเขาพูดต่อโดยไม่ได้ดูหน้าฉันด้วยซ้ำ\n\n“ผมเคยจะบอกคุณเมื่อสามปีก่อนเหมือนกันนะ แต่ผมเห็นคนอื่นเขายืนรออยู่ก่อนผม แล้วเขาก็รอมาตลอดสามปี ผมทำแบบนั้นไม่ได้หรอก ผมทนสามอาทิตย์ยังไม่ไหวเลย”\n\nแล้วเขาก็หัวเราะเสียงดัง ตบราวเหล็กหนึ่งที แล้วเดินลงไปว่ายน้ำต่อ\n\nข้างล่างนั่น สระยังเรืองแสงอยู่ดวงเดียวในความมืด\n\n(ธารขึ้นมาปิดหน้าต่างให้ เขาไม่ได้เขียนการ์ด — ลองใหม่)",
      en:"I walk over to him.\n\nTarn turns, grins the way he always does, and then goes quiet for an unusually long time.\n\n“The card wasn't me,” he says, straight out, because he says everything straight out. “I did go into your room. I went in to shut the window. Rain was already halfway across the floor.”\n\n“And the glass of water?”\n\n“You've woken up thirsty at 3am every night since second year,” he says, like it's ordinary public information. “So I poured you one.”\n\nHe keeps going without even looking at me.\n\n“I was going to tell you something three years ago too. But I saw somebody else already standing there waiting. And he's been waiting the whole three years. I couldn't do that. I couldn't last three weeks.”\n\nThen he laughs, loudly, slaps the rail once, and goes back down to swim.\n\nBelow, the pool is still the only lit thing in the dark.\n\n(Tarn came up to close a window. He didn't write the card. Try again.)"} },

const SAVE = "nightduty.v1";
const fresh = () => ({ lang:"th", scene:"arrival", items:{}, ev:{}, notes:{}, flags:{}, conc:{},
                       scares:true, sound:true, ms:0, done:null });
let S = fresh(), started = 0, mem = null;

function save(){
  S.ms += performance.now() - started; started = performance.now();
  try{ localStorage.setItem(SAVE, JSON.stringify(S)); }catch(e){ mem = JSON.stringify(S); }
}
function load(){
  try{ const r = localStorage.getItem(SAVE) || mem; return r ? JSON.parse(r) : null; }
  catch(e){ return mem ? JSON.parse(mem) : null; }
}
function wipe(){ try{ localStorage.removeItem(SAVE); }catch(e){} mem = null; }

const L  = k => (STR[k] && (STR[k][S.lang] || STR[k].th)) || k;

/* ============================ audio ============================ */
let AC = null, amb = null;
function actx(){
  if(AC) return AC;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  return AC;
}
function noise(dur){
  const c = actx(); if(!c) return null;
  const n = c.sampleRate * dur, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  const s = c.createBufferSource(); s.buffer = b; return s;
}
function ambient(){
  const c = actx(); if(!c || amb) return;
  const g = c.createGain(); g.gain.value = 0; g.connect(c.destination);
  const f = c.createBiquadFilter(); f.type="lowpass"; f.frequency.value = 180; f.connect(g);
  [41.2, 41.9, 62.1].forEach(hz=>{
    const o = c.createOscillator(); o.type="sawtooth"; o.frequency.value = hz;
    const og = c.createGain(); og.gain.value = .28; o.connect(og); og.connect(f); o.start();
  });
  const w = noise(6); if(w){ w.loop = true; const wf = c.createBiquadFilter();
    wf.type="bandpass"; wf.frequency.value = 420; wf.Q.value = .7;
    const wg = c.createGain(); wg.gain.value = .05; w.connect(wf); wf.connect(wg); wg.connect(g); w.start(); }
  amb = g; g.gain.linearRampToValueAtTime(S.sound ? .16 : 0, c.currentTime + 3);
}
function sfx(kind){
  const c = actx(); if(!c || !S.sound) return;
  const t = c.currentTime, g = c.createGain(); g.connect(c.destination);
  if(kind==="click"){ const o=c.createOscillator(); o.type="triangle"; o.frequency.setValueAtTime(760,t);
    o.frequency.exponentialRampToValueAtTime(220,t+.07); g.gain.setValueAtTime(.05,t);
    g.gain.exponentialRampToValueAtTime(.0005,t+.09); o.connect(g); o.start(t); o.stop(t+.1); }
  if(kind==="step"){ const n=noise(.2); if(!n) return; const f=c.createBiquadFilter();
    f.type="lowpass"; f.frequency.value=520; g.gain.setValueAtTime(.10,t);
    g.gain.exponentialRampToValueAtTime(.0005,t+.2); n.connect(f); f.connect(g); n.start(t); n.stop(t+.22); }
  if(kind==="good"){ [523,659,784].forEach((hz,i)=>{ const o=c.createOscillator(); o.type="sine";
    o.frequency.value=hz; const gg=c.createGain(); gg.gain.setValueAtTime(0,t+i*.08);
    gg.gain.linearRampToValueAtTime(.07,t+i*.08+.02);
    gg.gain.exponentialRampToValueAtTime(.0005,t+i*.08+.5); o.connect(gg); gg.connect(c.destination);
    o.start(t+i*.08); o.stop(t+i*.08+.55); }); }
  if(kind==="bad"){ const o=c.createOscillator(); o.type="square"; o.frequency.setValueAtTime(150,t);
    o.frequency.exponentialRampToValueAtTime(70,t+.28); g.gain.setValueAtTime(.06,t);
    g.gain.exponentialRampToValueAtTime(.0005,t+.3); o.connect(g); o.start(t); o.stop(t+.32); }
  if(kind==="note"){ const o=c.createOscillator(); o.type="sine"; o.frequency.value=440;
    g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.0005,t+.6);
    o.connect(g); o.start(t); o.stop(t+.62); }
  if(kind==="scare"){
    const n=noise(1.1); if(n){ const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=900;
      g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0006,t+1.0);
      n.connect(f); f.connect(g); n.start(t); n.stop(t+1.1); }
    const o=c.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(1400,t);
    o.frequency.exponentialRampToValueAtTime(48,t+.9);
    const og=c.createGain(); og.gain.setValueAtTime(.34,t);
    og.gain.exponentialRampToValueAtTime(.0006,t+.95);
    o.connect(og); og.connect(c.destination); o.start(t); o.stop(t+1.0);
    for(let i=0;i<3;i++){ const b=c.createOscillator(); b.type="sine"; b.frequency.value=52;
      const bg=c.createGain(); bg.gain.setValueAtTime(0,t+1.1+i*.72);
      bg.gain.linearRampToValueAtTime(.2,t+1.16+i*.72);
      bg.gain.exponentialRampToValueAtTime(.0006,t+1.5+i*.72);
      b.connect(bg); bg.connect(c.destination); b.start(t+1.1+i*.72); b.stop(t+1.6+i*.72); } }
}
function noteTone(i){
  const c = actx(); if(!c || !S.sound) return;
  const hz = [0,392,440,494,523,587,659,740,784][i] || 440;
  const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = "triangle"; o.frequency.value = hz;
  g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.0005,t+.75);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.8);
}
