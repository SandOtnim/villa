/* ============================ conditions ============================ */
const allConc = () => Object.keys(CONCLUSIONS).every(k => S.conc[k]);
function ok(c){
  if(!c) return true;
  if(c.has    && !S.items[c.has])   return false;
  if(c.lacks  &&  S.items[c.lacks]) return false;
  if(c.flag   && !S.flags[c.flag])  return false;
  if(c.noflag &&  S.flags[c.noflag])return false;
  if(c.ready    && !allConc()) return false;
  if(c.notready &&  allConc()) return false;
  return true;
}

/* ============================ step runner ============================ */
let busy = false;
function waitSay(txt){
  return new Promise(res=>{
    sayTxt.textContent = LT(txt);
    sayMore.textContent = L("tapToContinue");
    sayBox.style.display = "block";
    const go = () => { sayBox.style.display="none"; sayBox.removeEventListener("click",ask);
                       document.removeEventListener("keydown",kd); MP.sayGo=null; sfx("click"); res(); setTimeout(()=>MP.drain(),0); };
    const ask = () => MP.act({ t:"tap" });        // ใครกดก็ได้ แล้วทุกคนไปต่อพร้อมกัน
    const kd = e => { if(e.code==="Space"||e.code==="Enter"||e.code==="Escape"){ e.preventDefault(); ask(); } };
    MP.sayGo = go;
    if(MP.pendingTap && Date.now()-MP.pendingTap < 900){ MP.pendingTap=0; setTimeout(go,30); }
    sayBox.addEventListener("click", ask);
    document.addEventListener("keydown", kd);
  });
}
function waitModal(id){
  return new Promise(res=>{
    openM(id);
    const m = $(id);
    const iv = setInterval(()=>{ if(m.style.display==="none"){ clearInterval(iv); res(); } }, 120);
  });
}
function showNote(nid){
  const n = NOTES[nid]; if(!n) return Promise.resolve();
  S.notes[nid] = 1;
  $("noteBody").innerHTML = "<b>"+esc(LT(n.title))+"</b>"+esc(LT(n.body));
  sfx("note"); refreshHud();
  return waitModal("mNote");
}
function showCloseup(cid){
  $("cuImg").src = IMG[cid] || cid;
  $("cuImg").onerror = function(){ this.style.display="none"; };
  $("cuImg").style.display = "block";
  return waitModal("mCloseup");
}
function doScare(img){
  if(!S.scares) return Promise.resolve();
  return new Promise(res=>{
    const el = $("scare"), im = $("scareImg");
    im.src = IMG[img] || img;
    el.style.display = "block";
    $("flash").style.opacity = "1";
    setTimeout(()=>{ $("flash").style.transition=".22s"; $("flash").style.opacity="0"; }, 40);
    document.body.classList.add("shake");
    sfx("scare");
    setTimeout(()=>{ document.body.classList.remove("shake"); }, 500);
    setTimeout(()=>{ el.style.display="none"; $("flash").style.transition=""; res(); }, 1150);
  });
}
async function runCode(lockId){
  const lock = LOCKS[lockId];
  const okc = await showCode(lockId);
  if(okc){ S.flags["code_"+lockId] = 1; await run(lock.then || []); }
}
async function run(steps){
  if(!steps) return;
  for(const s of steps){
    if(s.if && !ok(s.if)) continue;
    if(s.once){ const k = "_once_"+s.once; if(S.flags[k]) continue; S.flags[k] = 1; }
    if(s.say)     await waitSay(s.say);
    if(s.closeup) await showCloseup(s.closeup);
    if(s.note)    await showNote(s.note);
    if(s.scare)   await doScare(s.scare);
    if(s.take)    give(s.take);
    if(s.ev)      giveEv(s.ev);
    if(s.set)     S.flags[s.set] = 1;
    if(s.code)    await runCode(s.code);
    if(s.puzzle)  await showRanat();
    if(s.goto)  { await goTo(s.goto); save(); return; }
    if(s.accuse)  await showAccuse();
    save();
  }
  refreshHud();
}
function give(id){ if(S.items[id]) return; S.items[id]=1;
  toast(L("gotItem")+" "+LT(ITEMS[id].name)); sfx("good"); refreshHud(); refreshBag(); }
function giveEv(id){ if(S.ev[id]) return; S.ev[id]=1;
  toast(L("gotEvidence")+" "+LT(EVIDENCE[id].name)); sfx("good"); refreshHud(); }

/* ============================ scene ============================ */
let reveal = false;
async function goTo(id){
  S.scene = id; sfx("step");
  const sc = SCENES[id];
  sceneImg.style.opacity = "0";
  await new Promise(r=>setTimeout(r,220));
  sceneImg.onerror = ()=>{ $("missing").style.display="flex";
    $("missing").querySelector("b").textContent = LT(sc.name);
    $("missing").querySelector("span").textContent = L("imgMissing"); sceneImg.style.opacity="0"; };
  sceneImg.onload  = ()=>{ $("missing").style.display="none"; sceneImg.style.opacity="1"; };
  $("missing").style.display = "none";
  $("where").textContent = "· · ·";
  sceneImg.src = IMG[sc.img] || sc.img;
  prefetch(sc);
  drawHots();
  $("where").textContent = LT(sc.name);
  refreshHud();
  save();
  await run(sc.onEnter || []);
  drawHots();
}
const warmed = new Set();
function warm(key){
  const u = IMG[key]; if(!u || warmed.has(key)) return;
  warmed.add(key); const i = new Image(); i.decoding = "async"; i.src = u;
}
// Pull in whatever this room can lead to, so moving between rooms is instant.
function prefetch(sc){
  (sc.hotspots||[]).forEach(h=>(h.do||[]).forEach(st=>{
    if(st.goto && SCENES[st.goto]) warm(SCENES[st.goto].img);
    if(st.closeup) warm(st.closeup);
    if(st.scare)   warm(st.scare);
  }));
  Object.values(LOCKS).forEach(l => (l.then||[]).forEach(st=>{ if(st.closeup) warm(st.closeup); }));
}
function drawHots(){
  const sc = SCENES[S.scene]; hots.innerHTML = "";
  (sc.hotspots||[]).forEach(h=>{
    if(h.show && !ok(h.show)) return;
    const d = document.createElement("div");
    d.className = "hs" + (h.kind==="door" ? " door" : "") + (reveal ? " reveal" : "");
    d.dataset.id = h.id;
    d.style.left = h.x+"%"; d.style.top = h.y+"%"; d.style.width = h.w+"%"; d.style.height = h.h+"%";
    d.innerHTML = '<span class="tip"></span>';
    d.querySelector(".tip").textContent = LT(h.label);
    d.addEventListener("click", (e)=>{
      if(busy) return;
      MP.tap(e);                                  // วงกระเพื่อมให้เพื่อนเห็นว่าเรากดตรงไหน
      MP.act({ t:"hot", sc:S.scene, id:h.id });   // ส่งให้ทุกคนกดพร้อมกัน
    });
    hots.appendChild(d);
  });
}
// Using an item = tapping it in the bag bar. Most items work by simply being carried.
async function useItem(id){
  if(busy) return; busy = true; sfx("click"); ambient();
  if(id === "battery" && !S.flags.fl_full && S.items.flashlight){
    S.flags.fl_full = 1; sfx("good"); save();
    await waitSay({th:"ฉันใส่ถ่านใหม่ ลำแสงนิ่งขึ้นมาก\nตอนนี้ส่องขึ้นบันไดที่มืดสนิทได้แล้ว",
                   en:"New cells in. The beam steadies.\nNow it will reach up that pitch-black stairwell."});
  } else {
    await waitSay(ITEMS[id].desc);
  }
  drawHots(); refreshBag(); busy = false;
}

/* ============================ hud / bag ============================ */
function refreshHud(){
  const evN = Object.keys(S.ev).length, concN = Object.keys(S.conc).length;
  $("bBag").innerHTML  = L("bag")  + (Object.keys(S.items).length ? ' <i>'+Object.keys(S.items).length+'</i>' : "");
  $("bCase").innerHTML = L("casefile") + (evN ? ' <i>'+evN+'/6</i>' : "");
  $("hint").textContent = L("showHotspots");
  $("where").textContent = LT(SCENES[S.scene].name);
  document.documentElement.lang = S.lang;
}
function refreshBag(){
  const b = $("bag"); b.innerHTML = "";
  Object.keys(S.items).forEach(id=>{
    const d = document.createElement("div");
    d.className = "slot" + (id==="battery" && !S.flags.fl_full ? " on" : "");
    d.dataset.item = id;
    d.textContent = LT(ITEMS[id].name);
    d.addEventListener("click", ()=> useItem(id));
    b.appendChild(d);
  });
}

function dEvHTML(k,p){
  if(!S.ev[k]) return '<div class="dslot dlock" style="--r:'+p.r+'deg;left:'+p.l+';top:'+p.t+
    ';width:'+p.w+';aspect-ratio:1.1/1">— — —</div>';
  const e=EVIDENCE[k], src=IMG[dEVIMG[k]]||"";
  return '<div class="dslot dev'+(pick.includes(k)?' sel':'')+'" data-ev="'+k+'" style="--r:'+p.r+
    'deg;--z:'+p.z+'px;left:'+p.l+';top:'+p.t+';width:'+p.w+'">'+
    '<div class="ddoc"><div class="dtape"></div>'+
    '<img src="'+src+'" alt="" onerror="this.style.visibility=\'hidden\'">'+
    '<div class="dlab">'+esc(LT(e.name))+'</div><div class="dtab">'+dEVNO[k]+'</div></div></div>';
}
function dPages(){
  const EK=Object.keys(EVIDENCE), pages=[];
  for(let i=0;i<EK.length;i+=2){
    pages.push('<h5>'+dT('pgEv')+' '+dEVNO[EK[i]]+' – '+dEVNO[EK[i+1]]+'</h5>'+
      dEvHTML(EK[i],dPOS[0])+dEvHTML(EK[i+1],dPOS[1])+
      (i===0?'<div class="dclip" style="right:7%;top:8%"></div>':''));
  }
  /* ข้อสรุป */
  let c='<h5>'+dT('pgConc')+' · '+Object.keys(S.conc).length+'/3</h5>';
  Object.keys(CONCLUSIONS).forEach((k,i)=>{
    const p=dPOS3[i], got=S.conc[k];
    c += got
      ? '<div class="dslot" style="--r:'+p.r+'deg;--z:'+p.z+'px;left:'+p.l+';top:'+p.t+';width:'+p.w+'">'+
        '<div class="dconc"><b>✓ '+esc(LT(CONCLUSIONS[k].name))+'</b><small>'+
        esc(LT(CONCLUSIONS[k].text))+'</small></div></div>'
      : '<div class="dslot dlock" style="--r:'+p.r+'deg;left:'+p.l+';top:'+p.t+';width:'+p.w+
        ';height:20%">? ? ?</div>';
  });
  pages.push(c);
  /* ผู้ต้องสงสัย */
  let u='<h5>'+dT('pgSus')+'</h5>';
  Object.keys(SUSPECTS).forEach((k,i)=>{
    const p=dPOS4[i], src=IMG[dSUSIMG[k]]||"";
    u += '<div class="dslot" style="--r:'+p.r+'deg;--z:'+p.z+'px;left:'+p.l+';top:'+p.t+';width:'+p.w+'">'+
      '<div class="dcardp"><img src="'+src+'" alt="" onerror="this.style.visibility=\'hidden\'">'+
      '<div class="tx"><b>'+esc(LT(SUSPECTS[k].name))+'</b><small>'+esc(LT(SUSPECTS[k].role))+
      '</small></div></div></div>';
  });
  pages.push(u);
  /* ความสัมพันธ์ + เอกสาร */
  let d='<h5>'+dT('bond')+'</h5>';
  let rows='';
  const dROM=(typeof ROMANCE!=="undefined")?ROMANCE:null;
  (dROM?Object.keys(dROM).filter(k=>k!=="none"):[]).forEach(k=>{
    const v=(S.aff&&S.aff[k])||0;
    rows += esc(LT(ROMANCE[k].name))+' &nbsp; <span style="letter-spacing:.24em;color:'+
      (v>=3?'#a8506c':'#8b8578')+'">'+'♥'.repeat(v)+'○'.repeat(Math.max(0,5-v))+'</span><br>';
  });
  d += '<div class="dslot dnote" style="--r:-1deg;--z:5px;left:9%;top:20%;width:74%">'+rows+'</div>';
  d += '<h5 style="position:absolute;left:8%;right:8%;top:46%">'+dT('pgDoc')+'</h5>';
  const nk=Object.keys(S.notes).filter(k=>NOTES[k]);
  if(!nk.length){
    d += '<div class="dslot dnote" style="--r:1deg;--z:5px;left:11%;top:56%;width:70%">'+
         dT('noDoc')+'</div>';
  }else{
    nk.slice(0,5).forEach((k,i)=>{
      d += '<div class="dslot dnote" data-note="'+k+'" style="--r:'+((i%2)?1.2:-1.4)+
        'deg;--z:'+(5+i)+'px;left:'+(9+(i%2)*5)+'%;top:'+(56+i*8)+'%;width:74%;padding:7px 11px">'+
        esc(LT(NOTES[k].title))+'</div>';
    });
  }
  pages.push(d);
  return pages;
}
function dBuildRight(){

            : LT({th:"ยังต่อไม่ครบ<br>กลับไปหาต่อ",en:"Not enough yet.<br>Go back and look."}))+'</div>';
}
function dBuildLeft(){
  $("dPgL").innerHTML =
    '<h5>'+dT('brief')+'</h5>'+
    '<div class="dslot dnote dtyped" style="--r:.8deg;--z:4px;left:9%;top:23%;width:78%">'+
      esc(dT('briefBody')).replace(/\n/g,'<br>')+'</div>'+
    '<div class="dslot dsticky" style="--r:-3deg;--z:9px;left:20%;top:62%;width:58%">'+
      esc(dT('briefNote')).replace(/\n/g,'<br>')+'</div>'+
    '<div class="dclip dark" style="left:7%;top:15%"></div>';
}
const dEase = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function dApply(sh,p){
  sh.p=p;
  const bow=Math.sin(Math.PI*p), lift=bow*26, wob=Math.sin(Math.PI*p*2)*1.1*(p>.5?1:.4);
  sh.el.style.transform='translateZ('+lift.toFixed(2)+'px) rotateY('+(-179.4*p).toFixed(2)+
    'deg) rotateZ('+wob.toFixed(2)+'deg)';
  sh.paper.style.transform='rotateY('+(-bow*13).toFixed(2)+'deg)';
  const x=(-15+130*p), a=(bow*.55).toFixed(3);
  sh.gloss.forEach(g=>{ g.style.opacity=bow?1:0;
    g.style.background='linear-gradient(102deg,rgba(0,0,0,'+(bow*.22).toFixed(3)+') '+(x-46)+
      '%,rgba(255,255,255,'+a+') '+x+'%,rgba(0,0,0,'+(bow*.16).toFixed(3)+') '+(x+44)+'%)'; });
}
function dZ(){ dSheetsA.forEach((sh,i)=> sh.el.style.zIndex = sh.p>.5 ? (i+1) : (dSheetsA.length-i+1)); }
function dNavUp(){
  const N=dSheetsA.length;
  $("dPrev").disabled = !dOpened||dBusy||dSpread===0;
  $("dNext").disabled = !dOpened||dBusy||dSpread===N;
  $("dPageNo").textContent = dOpened ? dT('sheetOf')+' '+Math.min(dSpread+1,N)+' / '+N : "";
}
function dFlip(i,to){
  const sh=dSheetsA[i], from=sh.p, t0=performance.now();
  dBusy=true; sh.el.style.zIndex=99;
  (function step(now){
    const t=Math.min(1,(now-t0)/1080);
    dApply(sh, from+(to-from)*dEase(t));
    if(t<1) requestAnimationFrame(step); else { dBusy=false; dZ(); dNavUp(); sfx("click"); }
  })(t0);
}
function dNext(){ const N=dSheetsA.length; if(!dOpened||dBusy||dSpread>=N)return; dFlip(dSpread,1); dSpread++; dNavUp(); }
function dPrev(){ if(!dOpened||dBusy||dSpread<=0)return; dSpread--; dFlip(dSpread,0); dNavUp(); }
function dGoPage(i){ const s=(i%2===0)? i/2 : (i+1)/2; while(dSpread<s){dSheetsA[dSpread]&&dApply(dSheetsA[dSpread],1);dSpread++;} dZ(); dNavUp(); }

function dInfoEmpty(){ $("dInfo").innerHTML = '<div class="e">'+dT('emptyInfo')+'</div>'; }
function dBuild(keepSpread){
  const pages=dPages(), N=Math.ceil(pages.length/2), box=$("dSheets");
  box.innerHTML="";
  for(let i=0;i<N;i++){
    const el=document.createElement("div"); el.className="dsheet";
    el.innerHTML='<div class="dpaper">'+
      '<div class="dface f"><div class="dpg">'+(pages[i*2]||"")+'</div><div class="dgloss"></div></div>'+
      '<div class="dface b"><div class="dpg">'+(pages[i*2+1]||"")+'</div><div class="dgloss"></div></div>'+
      '</div>';
    box.appendChild(el);
  }
  dSheetsA=[...box.children].map(el=>({el,paper:el.querySelector(".dpaper"),
    gloss:[...el.querySelectorAll(".dgloss")],p:0}));
  dBuildLeft(); dBuildRight();
  const keep = keepSpread ? Math.min(dSpread,N) : 0;
  dSpread=0; dSheetsA.forEach(sh=>dApply(sh,0));
  while(dSpread<keep){ dApply(dSheetsA[dSpread],1); dSpread++; }
  dZ(); dNavUp();
  $("dCount").innerHTML = L("evidence")+' <b>'+Object.keys(S.ev).length+'</b>/6 &nbsp;·&nbsp; '+
    L("conclusions")+' <b>'+Object.keys(S.conc).length+'</b>/3';
}
function dTryLink(){
  if(pick.length<2) return;
  const [a,c]=pick;
  const hit=Object.keys(CONCLUSIONS).find(k=>{
    const p=CONCLUSIONS[k].pair; return !S.conc[k] && p.includes(a) && p.includes(c); });
  pick=[];
  setTimeout(()=>{
    if(hit){ S.conc[hit]=1; sfx("good"); save();
      toast(L("linkRight")+" "+LT(CONCLUSIONS[hit].name));
      dBuild(false); dGoPage(3);
      $("dInfo").innerHTML='<div class="n">'+esc(LT(CONCLUSIONS[hit].name))+'</div>'+
        '<p>'+esc(LT(CONCLUSIONS[hit].text))+'</p>';
    } else { sfx("bad"); toast(L("linkWrong")); dBuild(true); dInfoEmpty(); }
  },200);
}

/* --- เปิดปก / หยิบของ / หมุนแฟ้ม --- */
let dDrag=false,dMoved=false,dRX=7,dRY=-16,dTX=7,dTY=-16,dSX=0,dSY=0,dBX=0,dBY=0,dT0=0;
function dStartLoop(){
  dLive=true; dT0=performance.now();
  const bk=$("dBook");
  (function loop(now){
    if(!dLive) return;
    const t=(now-dT0)/1000;
    if(!dDrag){ dTY+=(-16+Math.sin(t*.21)*1.7-dTY)*.04; dTX+=(7+Math.cos(t*.17)*1.1-dTX)*.04; }
    dRX+=(dTX-dRX)*.09; dRY+=(dTY-dRY)*.09;
    bk.style.transform='rotateX('+dRX.toFixed(2)+'deg) rotateY('+dRY.toFixed(2)+'deg)';
    dRAF=requestAnimationFrame(loop);
  })(performance.now());
}
(function wireDossier(){
  const bk=$("dBook");
  bk.addEventListener("pointerdown",e=>{ if(e.target.closest(".dnav"))return;
    dDrag=true;dMoved=false;bk.classList.add("grab");
    dSX=e.clientX;dSY=e.clientY;dBX=dRY;dBY=dRX; });
  addEventListener("pointermove",e=>{ if(!dDrag)return;
    if(Math.abs(e.clientX-dSX)+Math.abs(e.clientY-dSY)>5)dMoved=true;
    dTY=Math.max(-46,Math.min(14,dBX+(e.clientX-dSX)*.17));
    dTX=Math.max(-8,Math.min(26,dBY-(e.clientY-dSY)*.11)); });
  const rel=()=>{ dDrag=false;bk.classList.remove("grab");setTimeout(()=>dMoved=false,60); };
  addEventListener("pointerup",rel); addEventListener("pointercancel",rel);

  $("dCover").addEventListener("click",()=>{
    if(dMoved||dOpened)return;
    dOpened=true; sfx("click");
    $("dCover").classList.add("open"); bk.classList.add("opened");
    $("dHintOpen").style.display="none"; setTimeout(dNavUp,260);
  });
  $("dNext").addEventListener("click",e=>{e.stopPropagation();dNext()});
  $("dPrev").addEventListener("click",e=>{e.stopPropagation();dPrev()});
  $("dClose").addEventListener("click",dCloseCase);

  $("mCase").addEventListener("click",e=>{
    if(dMoved)return;
    const nt=e.target.closest("[data-note]");
    if(nt){ dCloseCase(); showNote(nt.dataset.note); return; }
    const ev=e.target.closest("[data-ev]");
    if(!ev) return;
    const k=ev.dataset.ev, i=pick.indexOf(k);
    if(i>=0) pick.splice(i,1); else { pick.push(k); if(pick.length>2) pick.shift(); }
    sfx("click");
    document.querySelectorAll("#mCase .dslot[data-ev]").forEach(n=>
      n.classList.toggle("sel", pick.includes(n.dataset.ev)));
    const e2=EVIDENCE[k];
    $("dInfo").innerHTML='<div class="n">'+dEVNO[k]+' / ๐๖</div><h3>'+esc(LT(e2.name))+
      '</h3><p>'+esc(LT(e2.desc))+'</p>';
    dTryLink();
  });
  addEventListener("keydown",e=>{
    if($("mCase").style.display!=="flex")return;
    if(e.key==="ArrowRight")dNext();
    if(e.key==="ArrowLeft")dPrev();
    if(e.key==="Escape")dCloseCase();
  });
})();

/* ============================ code lock ============================ */
function showCode(lockId){
  const lock = LOCKS[lockId];
  return new Promise(res=>{
    let buf = "";
    $("codeT").textContent = L("lockedTitle");
    $("codeP").textContent = LT(lock.prompt) + "\n\n" + LT(lock.hint);
    $("codeMsg").textContent = "";
    const dial = $("dial"); const paint = ()=>{
      dial.innerHTML = "";
      for(let i=0;i<lock.digits;i++){ const s=document.createElement("span");
        s.textContent = buf[i] || "·"; dial.appendChild(s); }
    };
    const pad = $("pad"); pad.innerHTML = "";
    ["1","2","3","4","5","6","7","8","9","←","0","OK"].forEach(t=>{
      const btn = document.createElement("button"); btn.textContent = t;
      btn.addEventListener("click", ()=>{
        sfx("click");
        if(t==="←") buf = buf.slice(0,-1);
        else if(t==="OK"){
          if(buf === lock.answer){ $("codeMsg").textContent = L("codeRight"); sfx("good");
            setTimeout(()=>{ closeM("mCode"); res(true); }, 620); return; }
          $("codeMsg").textContent = L("codeWrong"); sfx("bad"); buf = "";
        }
        else if(buf.length < lock.digits) buf += t;
        paint();
      });
      pad.appendChild(btn);
    });
    paint(); openM("mCode");
    const iv = setInterval(()=>{ if($("mCode").style.display==="none"){ clearInterval(iv); res(buf===lock.answer); } },150);
  });
}

/* ============================================================
   MP — เล่นกับเพื่อน (ไม่มีเซิร์ฟเวอร์)
   ส่งกันสองทางพร้อมกัน แล้วกรองข้อความซ้ำทิ้ง
     1) แท็บในเครื่องเดียวกัน → BroadcastChannel (ทำงานแม้ไม่มีเน็ต)
     2) เครื่องเพื่อนคนละที่   → WebRTC ผ่าน Trystero (ต่อตรงถึงกัน)
   ============================================================ */
const MP = {
  on:false, room:null, me:null, name:"", color:"#8fd6b0", t0:0,
  peers:{}, seen:new Set(), q:[], sayGo:null, pendingTap:0, bc:null, tr:null, send:null, rev:0,
  COLORS:["#8fd6b0","#e58fc0","#d8b46a","#7fb6ff","#ff9a76","#b79aff","#6fe3d2","#f5e06a"],

  id(){ return Math.random().toString(36).slice(2,10); },

  start(room, name){
    this.room = room; this.name = (name||"ผู้เล่น").slice(0,14);
    this.me = this.id();
    this.color = this.COLORS[Math.abs([...this.me].reduce((a,c)=>a+c.charCodeAt(0),0)) % this.COLORS.length];
    this.on = true; this.t0 = Date.now();
    /* --- ช่องที่ 1: แท็บในเครื่องเดียวกัน --- */
    try{
      this.bc = new BroadcastChannel("villa-mp-"+room);
      this.bc.onmessage = e => this.recv(e.data);
    }catch(e){}
    /* --- ช่องที่ 2: เพื่อนคนละเครื่อง --- */
    try{
      if(window.__TRYSTERO){
        const r = window.__TRYSTERO.joinRoom({appId:"sandotnim-villa"}, room);
        const [sendMsg, getMsg] = r.makeAction("m");
        this.tr = r; this.trSend = sendMsg;
        getMsg(d => this.recv(d));
        r.onPeerJoin(()=>{ setTimeout(()=>this.raw({t:"hi"}),300); this.status(); });
        r.onPeerLeave(p=>{ this.status(); });
      }
    }catch(e){ console.warn("p2p ต่อไม่ได้:", e.message); }
    this.raw({t:"hi"});
    /* คนที่เข้าห้องก่อนเป็นคนถือสถานะ — คนมาทีหลังห้ามเขียนทับของเก่า */
    setInterval(()=>{ if(this.on && this.keeper() && !busy && !this.sayGo && !this.q.length)
      this.raw({t:"sync", S:JSON.parse(JSON.stringify(S))}); }, 1600);
    /* ตัวกวาดคิว + ตัวกันค้าง: ถ้าติดค้างนานผิดปกติให้ปลดล็อกเอง */
    setInterval(()=>{
      if(!this.on) return;
      if(busy && !this.sayGo){ this._stuck = (this._stuck||0) + 1; } else { this._stuck = 0; }
      if(this._stuck > 30){ busy = false; this._stuck = 0; drawHots(); }   /* ~12 วินาที */
      this.drain();
    }, 400);
    this.hookCursor();
    $("mpBar").classList.add("on");
    this.paintBar();
  },

  keeper(){ return !Object.values(this.peers).some(p => p.t0 < this.t0 || (p.t0===this.t0 && p.id < this.me)); },
  raw(m){
    m._i = this.id(); m._f = this.me; m._n = this.name; m._c = this.color; m._t = this.t0;
    this.seen.add(m._i);
    try{ this.bc && this.bc.postMessage(m); }catch(e){}
    try{ this.trSend && this.trSend(m); }catch(e){}
  },
  act(m){ this.raw(m); this.apply(m, true); },     /* ทำที่เครื่องตัวเองทันที ไม่ต้องรอ */

  recv(m){
    if(!m || !m._i || m._f === this.me) return;
    if(this.seen.has(m._i)) return;
    this.seen.add(m._i);
    if(this.seen.size > 900) this.seen = new Set([...this.seen].slice(-400));
    if(m._f && !this.peers[m._f]){
      this.peers[m._f] = {name:m._n, color:m._c, t0:m._t||Date.now(), id:m._f, t:Date.now()};
      this.paintBar(); this.status();
      this.raw({t:"hi"});
      if(this.keeper()) setTimeout(()=>{ if(!busy && !this.sayGo)
        this.raw({t:"sync", S:JSON.parse(JSON.stringify(S))}); }, 250);
    } else if(m._f){ this.peers[m._f].t = Date.now(); }
    this.apply(m, false);
  },

  apply(m, mine){
    if(m.t === "hi"){ return; }
    if(m.t === "cur" && !mine){ this.moveCursor(m._f, m.x, m.y, m._c, m._n); return; }
    if(m.t === "ring" && !mine){ this.ring(m.x, m.y, m._c); return; }
    if(m.t === "tap"){
      if(this.sayGo) this.sayGo(); else this.pendingTap = Date.now();
      return;
    }
    if(m.t === "hot"){ this.runHot(m.sc, m.id); return; }
    if(m.t === "sync" && !mine && (m._t||0) < this.t0){   /* รับสถานะจากคนที่มาก่อนเราเท่านั้น */
      if(busy || this.sayGo || this.q.length) return;   /* กำลังเล่นบทอยู่ อย่าเพิ่งเขียนทับ */
      const keep = S.lang;
      const wasScene = S.scene;
      Object.assign(S, m.S); S.lang = keep;
      if(m.S.scene !== wasScene) this.showScene(m.S.scene); else { refreshHud(); drawHots(); }
      return;
    }
  },

  drain(){ if(busy || this.sayGo) return; const n=this.q.shift(); if(n) this.runHot(n[0], n[1]); },
  showScene(id){
    if(!SCENES[id]) return;
    S.scene = id; const sc = SCENES[id];
    sceneImg.src = IMG[sc.img] || sc.img;
    $("missing").style.display = "none";
    $("where").textContent = LT(sc.name);
    drawHots(); refreshHud();
  },
  async runHot(scId, hid){
    if(busy || this.sayGo){ this.q.push([scId,hid]); return; }
    if(S.scene !== scId) this.showScene(scId);
    const sc = SCENES[scId]; if(!sc) return;
    const h = (sc.hotspots||[]).find(x=>x.id===hid); if(!h) return;
    busy = true; ambient(); sfx("click");
    await run(h.do || [{ say:{th:L("nothingHere"),en:L("nothingHere")} }]);
    drawHots(); busy = false;
    this.drain();
  },

  /* ---------- เมาส์ของแต่ละคน ---------- */
  hookCursor(){
    const fr = $("frame");
    let last = 0;
    addEventListener("pointermove", e=>{
      if(!this.on) return;
      const now = performance.now(); if(now - last < 55) return; last = now;
      const r = fr.getBoundingClientRect();
      const x = (e.clientX - r.left)/r.width, y = (e.clientY - r.top)/r.height;
      if(x<-.2||x>1.2||y<-.2||y>1.2) return;
      this.raw({t:"cur", x:+x.toFixed(4), y:+y.toFixed(4)});
    }, {passive:true});
  },
  tap(e){
    const r = $("frame").getBoundingClientRect();
    const x = (e.clientX - r.left)/r.width, y = (e.clientY - r.top)/r.height;
    this.raw({t:"ring", x:+x.toFixed(4), y:+y.toFixed(4)});
    this.ring(x, y, this.color);
  },
  moveCursor(id, x, y, color, name){
    let el = document.getElementById("mpc-"+id);
    if(!el){
      el = document.createElement("div"); el.className = "mpc"; el.id = "mpc-"+id;
      el.innerHTML = '<svg width="17" height="20" viewBox="0 0 17 20"><path d="M1 1l14 7.6-6.4 1.6-2.2 6.2z" '
        + 'fill="'+color+'" stroke="#0b0c10" stroke-width="1.4" stroke-linejoin="round"/></svg>'
        + '<b style="background:'+color+'">'+esc(name||"")+'</b>';
      $("mpCur").appendChild(el);
    }
    el.style.left = (x*100)+"%"; el.style.top = (y*100)+"%";
  },
  ring(x, y, color){
    const d = document.createElement("div"); d.className = "mpRing";
    d.style.cssText += "left:"+(x*100)+"%;top:"+(y*100)+"%;border-color:"+color;
    $("mpCur").appendChild(d); setTimeout(()=>d.remove(), 620);
  },

  paintBar(){
    const b = $("mpBar"); if(!b) return;
    const all = [{name:this.name+" (คุณ)", color:this.color}]
      .concat(Object.values(this.peers).map(p=>({name:p.name, color:p.color})));
    b.innerHTML = all.map(p=>'<span class="who"><i class="dot" style="background:'+p.color+'"></i>'
      + esc(p.name)+'</span>').join('') + '<span class="rm">ห้อง '+esc(this.room)+'</span>';
  },
  status(){
    const n = Object.keys(this.peers).length;
    const st = $("mpStat");
    if(st) st.textContent = n ? ("ต่อติดแล้ว · มีเพื่อนอยู่ในห้อง "+n+" คน") : "รอเพื่อนเข้าห้อง…";
    const pe = $("mpPeers");
    if(pe) pe.innerHTML = Object.values(this.peers).map(p=>'<span>'+esc(p.name)+'</span>').join('');
    this.paintBar();
  }
};

(function initMenu(){
  const bg=$("tBg"), wrap=$("tBgWrap"), cv=$("tDust"), cx=cv.getContext("2d");
  bg.style.backgroundImage="url("+IMG.ui_title+")";
  const im=new Image(); im.src=IMG.ui_title;
  const show=()=>{ bg.classList.add("on"); $("title").classList.add("ready");
    [...document.querySelectorAll("#tNav .titem")].forEach((b,i)=>
      setTimeout(()=>b.classList.add("in"), 460+i*85)); };
  im.onload=show; im.onerror=()=>{ bg.style.background="linear-gradient(160deg,#16202b,#05070a)"; show(); };
  setTimeout(show,1800);
  let motes=[];
  const size=()=>{ cv.width=innerWidth; cv.height=innerHeight;
    motes=Array.from({length:Math.round(innerWidth*innerHeight/32000)},()=>({
      x:Math.random()*cv.width,y:Math.random()*cv.height,r:.5+Math.random()*1.6,
      a:.05+Math.random()*.2,vy:-(.05+Math.random()*.15),ph:Math.random()*6.28,
      sw:.15+Math.random()*.5})); };
  size(); addEventListener("resize",()=>{ if($("title").style.display!=="none") size(); });
  const t0=performance.now();
  (function loop(now){
    if($("title").style.display!=="none"){
      const t=(now-t0)/1000, s7=.7, A=12;
      const dx=Math.sin(t*.083*s7)*A+Math.sin(t*.031*s7)*A*.55;
      const dy=Math.cos(t*.061*s7)*A*.65+Math.sin(t*.024*s7)*A*.4;
      wrap.style.transform="translate("+dx.toFixed(2)+"px,"+dy.toFixed(2)+"px) scale("+
        (1.06+Math.sin(t*.045*s7)*.008).toFixed(4)+")";
      $("tShaft").style.opacity=(.45*(.72+Math.sin(t*.19)*.28)).toFixed(3);
      cx.clearRect(0,0,cv.width,cv.height);
      for(const m of motes){
        m.y+=m.vy; m.x+=Math.sin(t*m.sw+m.ph)*.18;
        if(m.y<-6){ m.y=cv.height+6; m.x=Math.random()*cv.width; }
        cx.globalAlpha=m.a*(.55+Math.sin(t*1.4+m.ph)*.45);
        cx.fillStyle="#fff"; cx.beginPath(); cx.arc(m.x,m.y,m.r,0,6.2832); cx.fill();
      }
      cx.globalAlpha=1;
    }
    requestAnimationFrame(loop);
  })(performance.now());
})();

/* หน้าโหลด — ขึ้นหลังกดเริ่มเกม ไม่ใช่หน้าแรก
   ระหว่างนี้ preload ภาพฉากแรกจริงๆ ไปด้วย จะได้ไม่เข้าไปเจอจอเปล่า */
const LOAD_TIPS = {"th": ["การ์ดใบนั้นไม่ได้เขียนถึงเจ้าสาว ลองอ่านอีกรอบ", "ทุกคนในบ้านนี้พูดความจริง แค่ไม่ใช่ทั้งหมด", "นับแก้วบนโต๊ะ แล้วนับคนอีกที", "ห้องที่ล็อกตอนหัวค่ำ อาจไม่ได้ล็อกตอนตีสาม", "น้ำขึ้นตอนตีสี่ รอยเท้าบนหาดจะหายไป"], "en": ["That card was not written to the bride. Read it again.", "Everyone here tells the truth. Just not all of it.", "Count the glasses on the table. Then count the people.", "A door locked at dusk may not be locked at three.", "The tide comes in at four. The footprints go with it."]};
function begin(cont){
  const ld=$("load"), bar=$("lBar"), pct=$("lPct"), tip=$("lTip");
  $("title").style.display="none";
  ld.classList.add("on");
  $("lName").textContent = L("title");
  const first = (cont && prev) ? prev.scene : fresh().scene;
  const bgKey = (SCENES[first] && SCENES[first].img) || "ui_title";
  $("lBg").style.backgroundImage = "url("+(IMG[bgKey]||IMG.ui_title)+")";
  const bi=new Image(); bi.src=IMG[bgKey]||IMG.ui_title;
  bi.onload=()=>$("lBg").classList.add("on"); bi.onerror=()=>$("lBg").classList.add("on");
  const tps = LOAD_TIPS[S.lang] || LOAD_TIPS.th;
  let ti=Math.floor(Math.random()*tps.length);
  const nextTip=()=>{ tip.style.opacity=0;
    setTimeout(()=>{ tip.textContent="“"+tps[ti%tps.length]+"”"; tip.style.opacity=1; ti++; },420); };
  nextTip(); const tipT=setInterval(nextTip,3400);
  /* โหลดภาพฉากแรกไว้ล่วงหน้า */
  let loaded=0, want=0;
  try{ (SCENES[first].hotspots||[]).forEach(h=>{}); }catch(e){}
  [bgKey].concat(Object.keys(IMG).slice(0,6)).forEach(k=>{ if(!IMG[k])return; want++;
    const im=new Image(); im.onload=im.onerror=()=>loaded++; im.src=IMG[k]; });
  let p=0;
  const iv=setInterval(()=>{
    const target = want ? 40+60*(loaded/want) : 100;
    p = Math.min(100, Math.max(p+Math.random()*7+2, Math.min(p+9, target)));
    bar.style.width=p+"%"; pct.textContent=Math.floor(p)+"%";
    if(p>=100){ clearInterval(iv); clearInterval(tipT);
      setTimeout(()=>{ ld.classList.remove("on"); beginNow(cont); }, 650); }
  },230);
}
function beginNow(cont){
  if(cont && prev) S = Object.assign(fresh(), prev);
  else { wipe(); S = fresh(); }
  started = performance.now();
  $("title").style.display = "none";
  ambient();
  refreshAll();
  goTo(S.scene);
  if(dev) setInterval(()=>{ $("dev").textContent =
    S.scene+" · ev "+Object.keys(S.ev).length+" · fl "+Object.keys(S.flags).length; }, 500);
}
